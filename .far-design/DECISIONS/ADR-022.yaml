# ADR（§12.4）
adr_id: ADR-022
title: "赛道1A主领域决策:以『恒星活动-热木星半径膨胀』为 hero case(决策矩阵选定)"
status: accepted
context: "Track-1A 执行协议 §11.1 要求框架保持通用但必须锁定一个科学深度足够、数据真实、可复现、能形成反馈的 hero case;决策矩阵十维打分;禁止仅因现有 demo 而锁定"
facts: "候选领域与事实:①恒星活动/系外行星——已有 exoplanet adapter(NASA Exoplanet Archive TAP live+replay)、analysis(pearson+CI)、Observation→Feedback→Revision 闭环已接线;Science-125 问题之一;②TESS 光变(方向2 A)——demo 用合成光变曲线,真实 TESS 数据需 MAST 下载+大带宽;③日冕加热(方向2 B)——无现成数据适配器;④CRISPR/生物——高风险伦理 gate;⑤通用材料科学——无数据源"
assumptions: "评审重点是假设生成与计划设计的证据约束,不是数据建模任务的精度;B 方向风险=把 hero 做成一键分析工具而非假设-计划系统(协议 §11.1 明示此风险)"
forces: "现有代码可复用度 vs 科学深度 vs 数据许可证 vs 被误解为方向2(B 方向)风险"
requirements: "SEC-S1A-01/02/03"
quality_scenarios: "QS-RESEARCH-01"
options:
  - "恒星活动↔热木星半径膨胀(选定):复用度 100% 已有适配器;NASA 公共领域数据;关联≠因果的诚实边界已有测试;科学问题本身即 Science-125 之一"
  - "TESS 恒星耀发统计:真实数据获取成本高(MAST 批量下载);易滑向方向2 A 数据建模"
  - "日冕加热机制对比:科学深度佳但需新数据适配器+多波段观测,首轮成本不可控"
simple_baseline: "保持通用框架不锁 hero(违背 §11.1 退出条件)"
decision: "hero case=『恒星活动是否膨胀热木星半径』(evidence-constrained hypothesis + plan,配 NASA Exoplanet Archive 真实 TAP 分析作为计划可执行性验证);明确不宣称方向2 的完整 B 闭环(无仪器回路,只有一次真实分析步骤)"
rationale: "决策矩阵十维:与 1A 一致性 10/10(假设生成+计划设计);代码复用 10/10;数据可得 9/10(公共域+免费 TAP);许可证 10/10(PD);可证伪 9/10(r 阈值可预注册);反馈形成 10/10(Observation→FeedbackSignal→Revision 已接线);计算成本 10/10(单次 TAP+纯统计);专家评估 8/10;复现难度 9/10(replay fixture+rawChecksum);误判为 B 风险 6/10(靠『分析只是计划可执行性验证』定位压制)"
positive_consequences: "hero case 全部证据链可离线复现;计划参数真实控制适配器输入(extractPlanParameters);负结果如实保留(FAILED/非显著路径有测试)"
negative_consequences: "仅覆盖单个天文领域问题;通用性靠框架测试与评估集其余问题支撑,不靠 hero 单一案例"
risks:
  - "评审误读为方向2 A 数据建模→README/答辩口径固定『分析是计划可执行性验证,不是数据建模任务』"
prototype_evidence: "tests/research/exoplanet_analysis.test.ts(8 例);tests/research/experiment.test.ts(8 例);历史 live 实测(TAP n=392/r=0.587,记录于 docs/development/PROGRESS.md 2026-08-09 前后 checkpoint;数据会漂移,replay fixture 现为 n=60,不代表当前 live 快照)"
migration: null
rollback: "hero case 仅影响 docs/README 案例与 exoplanet adapter 挂载点,不涉及内核;回退=移除 README hero 段"
reopen_triggers:
  - "评审反馈要求换领域(需重新跑决策矩阵)"
supersedes: null
