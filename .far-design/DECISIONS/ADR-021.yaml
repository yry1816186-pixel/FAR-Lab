# ADR（§12.4）
adr_id: ADR-021
title: "IC-05 生命周期审计落点修正:lifecycle_events 自承载证链,不写入 falsification_audit_events"
status: accepted
context: "IC-05 实施;冻结设计 retraction_lifecycle.yaml 不变量原文「所有迁移入 falsification_audit_events」"
facts: "falsification_audit_events: contract_id FK RESTRICT→falsifiability_contracts;rule_id CHECK(RULE-FS-001/001b/002/003);check_kind='falsification_sufficiency' 固定——该表语义域=falsification 充分性审计,生命周期事件(撤回/纠正/supersede)不属其域"
assumptions: "审计等价性=append-only+触发器+事件级 hash 链+actor/reason/时间戳,不要求物理同表"
forces: "冻结不变量字面 vs 语义域纯洁性(滥用 CHECK 约束塞入异质事件=审计面污染)"
requirements: "SCI-005/DAT-005/SEC-010"
quality_scenarios: "QS-GOV-01"
options:
  - "字面遵循:生命周期事件塞入 falsification_audit_events(需伪造 contract_id/rule_id=审计污染)"
  - "改 falsification_audit_events CHECK/FK(破坏既有审计不变量)"
  - "lifecycle_events 自承 append-only+hash 链(选定)"
simple_baseline: "0006 表保持 falsification 专用"
decision: "生命周期事件写入 0021 新表 lifecycle_events(append-only 触发器+事件级 prev/current hash 链+actor+reason+created_at);falsification_audit_events 保持 falsification 专用"
rationale: "审计等价性由同构机制(触发器+hash 链+签核留痕)提供;语义域纯洁避免审计面污染;不变量意图(可追溯/不可抵赖/append-only)完整保留"
positive_consequences: "语义域清晰;生命周期链独立可验(verifyLifecycleChain);不触动 0006 既有保证"
negative_consequences: "与冻结 yaml 字面表述存在偏差(本 ADR 即偏差登记);两张审计表需分别校验"
risks:
  - "评审误读为未遵循冻结设计→本 ADR+IC-05 EVIDENCE 显式登记"
prototype_evidence: "tests/evidence_log/lifecycle.test.ts;.far-implementation/contracts/IC-05/"
migration: "0021_lifecycle_events"
rollback: "停用查询面(表保留)"
reopen_triggers:
  - "治理裁决要求物理同表(需同步重设计 0006 约束)"
supersedes: null
