[project]
name = "farlab-experiment-runtime"
version = "0.1.0"
description = "FAR-Lab experiment execution sidecar: sklearn model builders, metrics and preregistered statistics over a stdio JSON protocol"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0,<3",
    "scikit-learn>=1.5,<2",
    "scipy>=1.14,<2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["farlab_experiment_runtime"]
