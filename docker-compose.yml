# FAR-Lab docker-compose
#
# 默认 service 全部 offline（无需 API key）：
#   docker compose up far-demo     # 一次性 offline TESS demo（裁决内核 + 篡改检测演示）
#   docker compose up far-api      # 长驻 API server @ http://localhost:3000（offline 匿名 demo）
#
# 真实 Qwen/百炼推理（可选·NEEDS_API_KEY）：
#   echo "DASHSCOPE_API_KEY=sk-..." > .env
#   docker compose --env-file .env up far-api
# 红线：绝不默认读取宿主 .env；必须显式 --env-file。

services:
  far-demo:
    build: .
    image: far-lab:dev
    command: ["demo", "tess-offline"]
    # 一次性 offline demo：15 Golden Vectors + C-ASTRO-0001 TESS 裁决 + 防篡改密封

  far-api:
    build: .
    image: far-lab:dev
    # 非回环绑定（容器端口映射必需 0.0.0.0）必须走受保护模式——匿名模式允许未认证
    # 写信任账本，api 启动安全门会拒绝在 0.0.0.0 上匿名运行（fail-closed，实测行为）。
    # FAR_JWT_SECRET 用 :? 语法：缺失时 compose 显式报错并给修复指引，绝不硬编码演示密钥。
    command: ["api", "--host", "0.0.0.0", "--port", "3000", "--protected"]
    environment:
      - FAR_JWT_SECRET=${FAR_JWT_SECRET:?far-api 容器绑定 0.0.0.0 必须受保护：在 .env 写入 FAR_JWT_SECRET=<强随机值> 后用 docker compose --env-file .env up far-api}
    ports:
      - "3000:3000"
    # 受保护 Web Cockpit 后端（JWT 门禁）。前端：本地 `cd frontend && npm install && npm run dev` 连 localhost:3000。
    # offline 匿名体验（零配置）：docker compose up far-demo。
