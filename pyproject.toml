[project]
name = "far-lab-repro"
version = "1.0.0"
description = "Python deterministic replay helpers for FAR-Lab."
requires-python = ">=3.11"
# 依赖锁定按 repro-determinism 规范
# threadpoolctl：R9 BLAS 线程限定 nthread=1（deterministic_blas_ctx 上下文管理器）
# numpy：触发 BLAS 加载，threadpool_info() 才能观测 blas 条目（spec §8.2 has_blas fixture）
#   上限放宽至 <3.0（原 <2.0 过保守）：2026-08-02 实测 numpy 2.5.1 下 113 repro 测试 + 跨语言 canonical_hash byte-equal + TS numpy-dependent 测试全绿；numpy 2.x 与现代生态(astropy/opencv)共存必需
dependencies = [
    "threadpoolctl>=3.5,<4.0",
    "numpy>=1.24,<3.0",
    "sympy>=1.13,<2.0",
    "z3-solver>=4.13,<5.0",
    # RFC 8785 JCS 规范序列化——跨语言 canonical_hash byte-equal 契约的 Python 轴。
    # 缺失时 far_chain_repro.canonical_json 降级 json.dumps(sort_keys)（非 RFC 8785，
    # 浮点指数形式有已知字节差异），故列为核心依赖而非可选。
    "rfc8785>=0.1,<0.2",
]

[project.optional-dependencies]
dev = []
# science：C-ASTRO 真实在线数据集获取（P1-6 / Phase 5）。重依赖（astropy 栈），
# 不进核心 dependencies——仅在真实 TESS 取数场景手动安装（pip install -e .[science]）。
# 缺失时 dataset_fetch.py 返回 {"ok": false}，fetchOnlineDataset → null → cached_fixture 降级。
science = ["lightkurve", "astroquery"]

[tool.pytest.ini_options]
testpaths = ["repro/tests"]

# Distribution name is far-lab-repro; the importable Python package remains
# far_chain_repro (stable internal module name; renaming would churn 20+ import sites
# without functional benefit). find walks repro/ and discovers the package by directory.
[tool.setuptools.packages.find]
where = ["repro"]

[tool.ruff]
line-length = 100
