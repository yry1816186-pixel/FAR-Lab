# FAR-Lab Cross-Platform CI — Windows / Linux / macOS 三平台矩阵
# 目的：用户愿景「完整并且能够适应 win/linux/mac 系统」的工程化兜底。
#   现有 ci.yml 是 12 步串行 ubuntu-only 竞赛门禁（不可动）——本 workflow 是独立补充矩阵，
#   在同一仓库证明核心链路（install → typecheck → lint → test → frontend → hygiene）在
#   Windows / macOS / Linux 全部可复现运行。
# 设计原则：
#   - 不动 ci.yml（保持竞赛门禁 SSOT 稳定），本文件独立、可随时增删，不参与 needs 串行链。
#   - NODE_COMPILE_CACHE 在 job 级用 runner.temp（顶层 env 无法引用 runner.temp），
#     保证 Windows（无 /tmp）不把 V8 compile cache 泄漏进工作树（卫生门禁 compile_cache_no_leak）。
#   - better-sqlite3@12 提供 win32-x64 / darwin-arm64 / linux prebuilds，frozen install 即可。
#   - 无 DASHSCOPE_API_KEY 时 offline 路径覆盖核心；真实 LLM smoke 仍由主 ci.yml 条件门负责。
name: FAR-Lab Cross-Platform Matrix

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PNPM_VERSION: '10.29.3'
  NODE_VERSION: '24'
  PYTHON_VERSION: '3.11'

jobs:
  cross-platform:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      # job 级 env 可引用 runner.temp → 三平台统一的仓库外缓存目录
      NODE_COMPILE_CACHE: ${{ runner.temp }}/node-compile-cache
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: pyproject.toml
      - name: Install pnpm deps (frozen)
        run: pnpm install --frozen-lockfile
      - name: Install python deps
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install -e .
      - name: typecheck (tsc --noEmit, zero-tolerance)
        run: pnpm exec tsc --noEmit
      - name: lint (eslint src --max-warnings 0)
        run: pnpm run lint
      - name: test (node --test, TS unit + integration)
        run: pnpm run test
      - name: test:agent_loop (FSM + N3 anti-hallucination)
        run: pnpm run test:agent_loop
      - name: repo hygiene gate (root allowlist / no junk / 0/ leak)
        run: node scripts/repo_hygiene_gate.mjs

  frontend-matrix:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: npm ci (frozen install)
        run: npm ci --legacy-peer-deps
      - name: typecheck (tsc -b)
        run: npm run typecheck
      - name: lint
        run: npm run lint
      - name: test (vitest run)
        run: npm run test
      - name: build (tsc -b && vite build)
        run: npm run build
