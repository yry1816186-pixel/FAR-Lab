name: surgery

# Remote-surgery patch plane (2026-08-29 convergence): anchored, reviewable
# patch scripts for large files that cannot be safely rewritten whole from a
# remote work surface. Each patch is a committed .mjs script under
# scripts/surgery/ — fail-loud anchors, idempotent re-runs, no shell inputs.
# Scoped to converge/** branches only (never pull_request) so untrusted
# patches cannot ride this workflow.
on:
  push:
    branches: ['converge/**']
    paths: ['scripts/surgery/**']

permissions:
  contents: write

concurrency:
  group: surgery-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Apply anchored patch scripts + refresh structural context (idempotent, fail-loud)
        run: |
          node scripts/surgery/apply-store-protocol.mjs
          node scripts/surgery/dump-api-context.mjs
      - name: Commit applied patch / refreshed context
        run: |
          git config user.name "farlab-surgery-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/persistence/store.ts scripts/surgery/api-context.txt
          if git diff --cached --quiet; then
            echo "nothing to apply — tree already current"
          else
            git commit -m "chore(surgery): store kinds + api structural context refresh"
            git push
          fi
