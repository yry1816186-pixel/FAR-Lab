name: surgery

# Remote-surgery patch plane (2026-08-29 convergence): anchored, reviewable
# patch scripts for large files that cannot be safely rewritten whole from a
# remote work surface. Each patch is a committed .mjs script under
# scripts/surgery/ — fail-loud anchors, idempotent re-runs, no shell inputs.
#
# DORMANT: re-neutralized after web slice 2 (same discipline as slice 1).
# Push triggers removed — this workflow runs only on explicit manual
# dispatch (workflow_dispatch). On main the apply scripts no-op (anchors
# already applied); a manual dispatch only refreshes diagnostics. Mechanism,
# per-slice branch lifecycle and history: scripts/surgery/README.md.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: surgery-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Apply anchored patch scripts + refresh structural context (idempotent, fail-loud)
        run: |
          node scripts/surgery/apply-store-protocol.mjs
          node scripts/surgery/apply-api-protocol.mjs
          node scripts/surgery/apply-readme-protocol.mjs
          node scripts/surgery/apply-web-protocol.mjs
          node scripts/surgery/dump-api-context.mjs
      - name: Commit applied patches / refreshed context
        run: |
          git config user.name "farlab-surgery-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/persistence/store.ts src/server/api.ts README.md scripts/surgery/api-context.txt web/src/lab/StudyMap.tsx web/src/i18n/dict.ts web/src/lab/lab.css
          if git diff --cached --quiet; then
            echo "nothing to apply — tree already current"
          else
            git commit -m "chore(surgery): web protocol surface — StudyMap band + dict keys + lab.css"
            git push
          fi

  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install python deps for the experiment sidecar
        run: pip install numpy --quiet
      - name: Install root dependencies
        run: npm ci
      - name: Install web dependencies (root suite imports web/src)
        working-directory: web
        run: npm ci
      - name: Build backend dist (suite imports compiled output)
        run: npm run build
      - name: Typecheck (backend + CLI)
        run: npm run typecheck 2>&1 | tee /tmp/typecheck.txt || echo "TYPECHECK_FAILED" >> /tmp/typecheck.txt
      - name: Lint
        run: npm run lint 2>&1 | tee /tmp/lint.txt || echo "LINT_FAILED" >> /tmp/lint.txt
      - name: Full test suite (same gates as ci.yml verify)
        run: npm test 2>&1 | tee /tmp/vitest.txt || echo "VITEST_FAILED" >> /tmp/vitest.txt
      - name: Commit diagnostics
        run: |
          git config user.name "farlab-surgery-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p scripts/surgery
          { echo '===== typecheck (last 30 lines) ====='; tail -n 30 /tmp/typecheck.txt; echo; echo '===== lint (last 30 lines) ====='; tail -n 30 /tmp/lint.txt; echo; echo '===== FULL vitest (last 400 lines) ====='; tail -n 400 /tmp/vitest.txt; } > scripts/surgery/diag.txt
          git add scripts/surgery/diag.txt
          if git diff --cached --quiet; then
            echo "no diagnostics change"
          else
            git pull --rebase || true
            git commit -m "chore(surgery): diagnostics snapshot (full suite)"
            git push
          fi
