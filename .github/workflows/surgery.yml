name: surgery

# Remote-surgery patch plane — slice 5 (converge/theory-executor): the theory
# identity leg. New files (domain/theory.ts, executor-theory.ts, tests, this
# script) land whole; the seven anchored INTEGRATION edits (index/experiment/
# ops.py/spec-from-plan/execute/offline/store) are applied by CI on this branch.
# Re-neutralize to workflow_dispatch-only + no-op job at slice end (legal form,
# runs #22-#25 lesson).
on:
  workflow_dispatch:
  push:
    branches: ['converge/theory-executor']
    paths: ['scripts/surgery/.diag-trigger']

permissions:
  contents: write

concurrency:
  group: surgery-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Apply anchored patch scripts (idempotent, fail-loud, logged)
        run: |
          set -o pipefail
          rc=0
          run_script () {
            echo "===== node scripts/surgery/$1.mjs =====" | tee -a /tmp/apply.log
            if ! node "scripts/surgery/$1.mjs" 2>&1 | tee -a /tmp/apply.log; then
              echo "SCRIPT FAILED: $1" | tee -a /tmp/apply.log
              rc=1
            fi
          }
          run_script apply-theory-executor
          echo "APPLY_RC=$rc" | tee -a /tmp/apply.log
          exit $rc
      - name: Commit applied patches + apply log (always)
        if: always()
        run: |
          git config user.name "farlab-surgery-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          [ -f /tmp/apply.log ] || echo '(apply log missing — apply step crashed before first tee)' > /tmp/apply.log
          cp /tmp/apply.log scripts/surgery/apply-log.txt
          git add src/domain/index.ts src/domain/experiment.ts src/domain/theory.ts src/experiment/spec-from-plan.ts src/experiment/executor-theory.ts src/pipeline/stages/execute.ts src/providers/offline.ts src/persistence/store.ts experiment-runtime/farlab_experiment_runtime/ops.py tests/executor-theory.test.ts scripts/surgery/apply-log.txt
          if git diff --cached --quiet; then
            echo "nothing to apply — tree already current"
          else
            git commit -m "chore(surgery): slice 5 theory-leg integration edits (7 files, anchored)"
            git pull --rebase
            git push
          fi

  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install python deps for the experiment sidecar
        run: pip install numpy --quiet
      - name: Install root dependencies
        run: npm ci
      - name: Install web dependencies (root suite imports web/src)
        working-directory: web
        run: npm ci
      - name: Install TUI dependencies (ci-only coverage)
        working-directory: packages/tui
        run: |
          set -o pipefail
          npm ci 2>&1 | tee /tmp/tui-install.txt || echo "TUI_INSTALL_FAILED" >> /tmp/tui-install.txt
      - name: Install desktop dependencies (ci-only coverage)
        working-directory: desktop
        run: |
          set -o pipefail
          npm ci 2>&1 | tee /tmp/desktop-install.txt || echo "DESKTOP_INSTALL_FAILED" >> /tmp/desktop-install.txt
      - name: Build backend dist (suite imports compiled output)
        run: |
          set -o pipefail
          npm run build 2>&1 | tee /tmp/build.txt || echo "BUILD_FAILED" >> /tmp/build.txt
      - name: Typecheck (backend + CLI)
        run: |
          set -o pipefail
          npm run typecheck 2>&1 | tee /tmp/typecheck.txt || echo "TYPECHECK_FAILED" >> /tmp/typecheck.txt
      - name: Lint
        run: |
          set -o pipefail
          npm run lint 2>&1 | tee /tmp/lint.txt || echo "LINT_FAILED" >> /tmp/lint.txt
      - name: Full test suite (same gates as ci.yml verify)
        run: |
          set -o pipefail
          npm test 2>&1 | tee /tmp/vitest.txt || echo "VITEST_FAILED" >> /tmp/vitest.txt
      - name: TUI package tests (ci-only coverage)
        working-directory: packages/tui
        run: |
          set -o pipefail
          npm test 2>&1 | tee /tmp/tui-test.txt || echo "TUI_TEST_FAILED" >> /tmp/tui-test.txt
      - name: CLI smoke (ci-only coverage)
        run: |
          set -o pipefail
          node dist/cli/main.js --help 2>&1 | tee /tmp/cli.txt || echo "CLI_FAILED" >> /tmp/cli.txt
      - name: License ledger gate (ci-only coverage)
        run: |
          set -o pipefail
          node zcode-harness/scripts/license-ledger.mjs --check 2>&1 | tee /tmp/license.txt || echo "LICENSE_FAILED" >> /tmp/license.txt
      - name: Secret scan (ci-only coverage)
        run: |
          set -o pipefail
          node zcode-harness/scripts/secret-scan.mjs 2>&1 | tee /tmp/secret.txt || echo "SECRET_FAILED" >> /tmp/secret.txt
      - name: Path hygiene (ci-only coverage)
        run: |
          set -o pipefail
          node zcode-harness/scripts/path-hygiene.mjs 2>&1 | tee /tmp/hygiene.txt || echo "HYGIENE_FAILED" >> /tmp/hygiene.txt
      - name: Web production build (ci-only coverage)
        working-directory: web
        run: |
          set -o pipefail
          npm run build 2>&1 | tee /tmp/webbuild.txt || echo "WEBBUILD_FAILED" >> /tmp/webbuild.txt
      - name: Commit diagnostics
        if: always()
        run: |
          git config user.name "farlab-surgery-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p scripts/surgery
          {
            echo '===== tui install (last 20 lines) ====='; tail -n 20 /tmp/tui-install.txt 2>/dev/null || echo '(missing)';
            echo; echo '===== desktop install (last 20 lines) ====='; tail -n 20 /tmp/desktop-install.txt 2>/dev/null || echo '(missing)';
            echo; echo '===== BUILD (last 60 lines) ====='; tail -n 60 /tmp/build.txt 2>/dev/null || echo '(build never ran)';
            echo; echo '===== typecheck (last 30 lines) ====='; tail -n 30 /tmp/typecheck.txt 2>/dev/null || echo '(missing)';
            echo; echo '===== lint (last 30 lines) ====='; tail -n 30 /tmp/lint.txt 2>/dev/null || echo '(missing)';
            echo; echo '===== FULL vitest (last 400 lines) ====='; tail -n 400 /tmp/vitest.txt 2>/dev/null || echo '(missing)';
            echo; echo '===== tui test (last 40 lines) ====='; tail -n 40 /tmp/tui-test.txt 2>/dev/null || echo '(missing)';
            echo; echo '===== cli smoke (last 20 lines) ====='; tail -n 20 /tmp/cli.txt 2>/dev/null || echo '(missing)';
            echo; echo '===== license (last 30 lines) ====='; tail -n 30 /tmp/license.txt 2>/dev/null || echo '(missing)';
            echo; echo '===== secret scan (last 40 lines) ====='; tail -n 40 /tmp/secret.txt 2>/dev/null || echo '(missing)';
            echo; echo '===== path hygiene (last 40 lines) ====='; tail -n 40 /tmp/hygiene.txt 2>/dev/null || echo '(missing)';
            echo; echo '===== web build (last 60 lines) ====='; tail -n 60 /tmp/webbuild.txt 2>/dev/null || echo '(missing)';
          } > scripts/surgery/diag.txt
          git add scripts/surgery/diag.txt
          if git diff --cached --quiet; then
            echo "no diagnostics change"
          else
            git stash
            git pull --rebase
            git stash pop
            git add scripts/surgery/diag.txt
            git commit -m "chore(surgery): diagnostics snapshot (full suite + ci-only gates)"
            git push
          fi
