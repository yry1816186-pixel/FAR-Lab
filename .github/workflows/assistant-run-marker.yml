name: Assistant UX Run Marker

on:
  push:
    branches: [ux-refactor/2026-08-18]

permissions:
  contents: write

jobs:
  mark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ux-refactor/2026-08-18
      - name: Record run id
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' "${GITHUB_RUN_ID}" > .assistant-run-id
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .assistant-run-id
          if ! git diff --cached --quiet; then
            git commit -m 'chore: record assistant workflow run id'
            git push origin HEAD:ux-refactor/2026-08-18
          fi
