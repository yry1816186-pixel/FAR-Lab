name: UX Refactor Visual QA

on:
  push:
    branches:
      - ux-refactor/2026-08-18
    paths:
      - .github/workflows/ux-refactor-visual-qa.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser_qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: pnpm/action-setup@a8198c4bff370c8506180b035930dea56dbd5288
        with:
          version: 10.29.3
          run_install: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install project dependencies
        shell: bash
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile
          (cd frontend && npm ci --legacy-peer-deps)
      - name: Install ephemeral Chromium QA runtime
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/far-visual-qa
          cd /tmp/far-visual-qa
          npm init -y >/dev/null
          npm install playwright@1.55.0 >/dev/null
          npx playwright install --with-deps chromium
      - name: Start FAR-Lab
        shell: bash
        run: |
          set -euo pipefail
          nohup pnpm run dev >/tmp/far-dev.log 2>&1 &
          for i in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:5173/ >/dev/null 2>&1; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/far-dev.log
          exit 1
      - name: Run responsive, theme, keyboard and overflow QA
        shell: bash
        run: |
          set -euo pipefail
          cat >/tmp/far-visual-qa/qa.mjs <<'EOF'
          import { chromium } from 'playwright';
          import fs from 'node:fs';

          const base = 'http://127.0.0.1:5173';
          const output = '/tmp/far-visual-qa/output';
          fs.mkdirSync(output, { recursive: true });
          const browser = await chromium.launch({ headless: true });
          const cases = [
            ['research-desktop-light', '/research', 1440, 900, 'light'],
            ['research-desktop-dark', '/research', 1440, 900, 'dark'],
            ['research-tablet-light', '/research', 820, 1180, 'light'],
            ['research-tablet-dark', '/research', 820, 1180, 'dark'],
            ['research-mobile-light', '/research', 390, 844, 'light'],
            ['research-mobile-dark', '/research', 390, 844, 'dark'],
            ['integrity-desktop-light', '/integrity', 1440, 900, 'light'],
            ['integrity-desktop-dark', '/integrity', 1440, 900, 'dark'],
            ['report-tablet-dark', '/report', 820, 1180, 'dark'],
            ['audit-mobile-light', '/audit', 390, 844, 'light'],
            ['overview-wide-light', '/overview', 1920, 1080, 'light'],
          ];
          const results = [];
          for (const [name, path, width, height, theme] of cases) {
            const context = await browser.newContext({ viewport: { width, height } });
            await context.addInitScript((value) => localStorage.setItem('far-chain-theme', value), theme);
            const page = await context.newPage();
            const started = Date.now();
            await page.goto(base + path, { waitUntil: 'domcontentloaded', timeout: 30000 });
            await page.waitForTimeout(1000);
            const mainCount = await page.locator('main').count();
            const h1Count = await page.locator('h1').count();
            const metrics = await page.evaluate(() => ({
              viewportWidth: document.documentElement.clientWidth,
              documentWidth: document.documentElement.scrollWidth,
              htmlDark: document.documentElement.classList.contains('dark'),
              readyState: document.readyState,
            }));
            if (mainCount === 0) throw new Error(`${name}: missing <main>`);
            if (h1Count === 0) throw new Error(`${name}: missing <h1>`);
            if (metrics.documentWidth > metrics.viewportWidth + 1) {
              throw new Error(`${name}: global horizontal overflow ${metrics.documentWidth} > ${metrics.viewportWidth}`);
            }
            if ((theme === 'dark') !== metrics.htmlDark) throw new Error(`${name}: theme mismatch`);
            await page.screenshot({ path: `${output}/${name}.png`, fullPage: true });
            results.push({ name, path, width, height, theme, elapsedMs: Date.now() - started, ...metrics });
            await context.close();
          }

          const context = await browser.newContext({ viewport: { width: 1440, height: 900 } });
          const page = await context.newPage();
          await page.goto(base + '/research', { waitUntil: 'domcontentloaded' });
          await page.keyboard.press('Control+K');
          const dialog = page.getByRole('dialog');
          await dialog.waitFor({ state: 'visible' });
          const input = page.locator('#command-center-search');
          if (!(await input.evaluate((el) => el === document.activeElement))) throw new Error('Command Center search did not receive focus');
          await input.fill('integrity');
          await page.keyboard.press('Enter');
          await page.waitForURL('**/integrity');
          results.push({ name: 'command-center-keyboard', passed: true, finalUrl: page.url() });
          await context.close();
          await browser.close();
          fs.writeFileSync(`${output}/results.json`, JSON.stringify(results, null, 2) + '\n');
          EOF
          node /tmp/far-visual-qa/qa.mjs
          cp /tmp/far-dev.log /tmp/far-visual-qa/output/dev.log
      - name: Upload browser QA evidence
        uses: actions/upload-artifact@v4
        with:
          name: FAR-Lab-visual-qa
          path: /tmp/far-visual-qa/output
          if-no-files-found: error
          retention-days: 3
