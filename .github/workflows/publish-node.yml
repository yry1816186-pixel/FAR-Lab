# FAR-Chain npm publish — 手动触发（NEEDS_NPM_PUBLISH_VALIDATION）
#
# 为什么手动 + 为什么有 validate_packaging gate：
#   packages/cli/bin/far.mjs 当前 spawn 根 src/cli/far.ts（resolve ../../../src/cli/far.ts · 跳出包）。
#   项目无 dist build（tsconfig noEmit · Node 24 原生 type-stripping 跑 .ts）。
#   独立 npm 发布需先解决打包：(a) tsc build 产出 dist，或 (b) files 纳入 ../../src + 改写路径。
#   在解决前，validate_packaging 会 fail，阻止发一个「装上跑不起来」的包（红线：不伪造）。
#
# NEEDS_HUMAN_OPERATION：首次发布需配置 secret NPM_TOKEN（npm access token）。

name: Publish npm

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (validate packaging only, no publish)'
        type: boolean
        default: true

permissions:
  contents: read

env:
  NODE_VERSION: '24'

jobs:
  validate_packaging:
    runs-on: ubuntu-latest
    outputs:
      self_contained: ${{ steps.check.outputs.self_contained }}
    steps:
      - uses: actions/checkout@v5
      - name: Check @far-chain/cli is self-contained
        id: check
        shell: bash
        run: |
          # far.mjs 若仍 spawn 包外 src/ → 独立 npm 包装上后找不到入口 → 不可发布。
          if grep -q "\.\./\.\./\.\./src/cli/far.ts" packages/cli/bin/far.mjs; then
            echo "self_contained=false" >> "$GITHUB_OUTPUT"
            echo "✗ @far-chain/cli 仍依赖包外 src/（far.mjs spawn ../../../src/cli/far.ts）。"
            echo "  独立 npm 发布前必须解决打包（NEEDS_NPM_PUBLISH_VALIDATION）。"
            echo "  选项：1) packages/cli 引入 tsc build → dist；2) files 纳入 ../../src + 改写路径。"
            echo "  详见 docs/governance/release-process.md。"
            exit 1
          fi
          echo "self_contained=true" >> "$GITHUB_OUTPUT"
          echo "✓ 打包自包含，可发布"

  publish:
    needs: validate_packaging
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: https://registry.npmjs.org
      - name: npm publish @far-chain/cli
        run: |
          cd packages/cli
          npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
