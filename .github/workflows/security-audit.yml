# Weekly dependency security audit (supply-chain
# hardening: scheduled `npm audit --omit=dev` + signature verification).
# Runs every Monday 02:00 UTC on main. Failure opens an issue via actionlint-free
# plain step (no third-party action): a failing step is visible in Actions UI.
name: Dependency Security Audit

on:
  schedule:
    - cron: '0 2 * * 1'
  workflow_dispatch:

permissions:
  contents: read

env:
  PNPM_VERSION: '10.29.3'
  NODE_VERSION: '24'

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0   # release_check 需 tags + 完整历史
      - uses: pnpm/action-setup@a8198c4bff370c8506180b035930dea56dbd5288
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - name: pnpm audit (all deps · high/critical gate)
        run: pnpm audit --audit-level=high
      - name: pnpm audit --prod (prod-only high/critical gate)
        run: pnpm audit --prod --audit-level=high
      - name: frontend npm audit (all deps · high/critical gate)
        working-directory: frontend
        run: npm audit --audit-level=high
      - name: pnpm audit signatures (registry provenance gate)
        run: pnpm audit signatures
      - name: supply-chain gate (exact pins + lockfile consistency)
        run: node scripts/check-supply-chain.mjs
