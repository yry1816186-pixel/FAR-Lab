# .github/workflows/entry-protocol-check.yml
# 入口协议 PR-body 校验（.agent/AGENT_ENTRY_PROTOCOL.md 步骤 2 + .agent/AGENT_ANTISKIM_TRIPWIRES.md T7/T8 机检钩子）
#
# 目的：把「agent 是否一句话陈述了单一真实依赖 + ledger_item」从软规则变成 PR-level 硬门。
#   PR body 须含两行（机器 grep，关键词不命中 → exit 1）：
#     ledger_item: <id>            —— id 须在 DEPTH_LEDGER §C 存在且 status ≠ WIRED_GREEN
#     single_real_dependency: <…>  —— 须含真实依赖关键词 symPy|dashscope|venv|hash 之一 + src/ path
#
# R9（body ↔ diff 一致性）：body 声称的 src/ path 须至少一个 ∈ PR changed-files。
#   防御：agent 在 body 写「single_real_dependency: symPy src/fec/orchestrator.ts:73」过 grep，
#   但实际 diff 只动 docs/tests——body 谎报接线目标，逃避 entry 协议。R9 用 gh api 拉 changed-files
#   交叉校验。gh api 失败（fork PR 权限 / 限流）→ WARN 跳过（depth_gate AST 是真后盾，R9 是纵深层）。
#
# ⚠️ maintainer 必做：把 `entry_protocol_check` 加入 Branch protection → Require status checks。
#
# 仅 PR 触发（push 无 PR body）。零依赖（bash + node 内置 grep + gh api）。
# agent 无关：对所有 commit 来源等价（Claude/GPT/Cursor/Copilot 提 PR 均被校验）。
name: entry-protocol-check

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read
  pull-requests: read   # R9: gh api pulls/N/files

jobs:
  entry_protocol_check:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      OWNER_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0   # release_check/no_verify_audit 需 tags + 完整历史
      - name: Validate PR body has ledger_item + single_real_dependency + src path ∈ changed files (R9)
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          set -e
          # R9: 拉 PR changed-files（gh api paginate），交 node 校验 body 声称的 src/ path ∈ diff。
          # gh api 失败 → 空串（2>/dev/null + || true），node 侧识别为「拉取失败」→ WARN 跳过 R9（不阻断）。
          CHANGED_FILES=$(gh api "repos/$OWNER_REPO/pulls/$PR_NUMBER/files" --paginate -q '.[].filename' 2>/dev/null | sort -u || true)
          export CHANGED_FILES
          node -e '
            const fs = require("node:fs");
            const body = process.env.PR_BODY || "";
            const changedFiles = (process.env.CHANGED_FILES || "").split(/\r?\n/).map(s => s.trim()).filter(Boolean);
            // 豁免机制：PR body 含 `entry_protocol_exempt: <reason>` 显式声明非深度接线 PR
            //   （governance / docs / CI-only / refactor）→ WARN 跳过 body 检查。
            //   depth_gate（AST CallExpression 接线门）仍是真接线后盾——豁免 body 检查不豁免 AST 门。
            const exemptMatch = body.match(/^\s*entry_protocol_exempt\s*:\s*(.+)/im);
            if (exemptMatch) {
              console.warn("○ entry_protocol_check EXEMPT: " + exemptMatch[1].trim() + "（非深度接线 PR；depth_gate AST 仍是真接线后盾）");
              process.exit(0);
            }
            const lines = { ledger_item: "", single_real_dependency: "" };
            for (const line of body.split(/\r?\n/)) {
              const m1 = line.match(/^\s*ledger_item\s*:\s*(\S+)/i);
              if (m1) lines.ledger_item = m1[1];
              const m2 = line.match(/^\s*single_real_dependency\s*:\s*(.+)/i);
              if (m2) lines.single_real_dependency = m2[1];
            }
            const fail = (msg) => { console.error("✗ entry_protocol_check FAIL: " + msg); process.exit(1); };
            const warn = (msg) => console.warn("○ entry_protocol_check WARN: " + msg);
            if (!lines.ledger_item) fail("PR body 缺 `ledger_item: <id>`（须为 DEPTH_LEDGER.md §C 中一个 id）");
            if (!lines.single_real_dependency) fail("PR body 缺 `single_real_dependency: <…>` 行");
            const dep = lines.single_real_dependency.toLowerCase();
            if (!/sympy|dashscope|venv|hash/.test(dep)) {
              fail("single_real_dependency 须含真实依赖关键词之一：symPy / dashscope / venv / hash。实际: " + lines.single_real_dependency);
            }
            if (!/src\//.test(lines.single_real_dependency)) {
              fail("single_real_dependency 须含 src/ 路径（被接线的生产 file:line）。实际: " + lines.single_real_dependency);
            }
            // 校验 ledger_item id 在 §C 存在 + 非 WIRED_GREEN（禁对已 closed item 提 PR 凑数）
            const ledgerPath = "FAR_LAB_MASTER_PLAN/DEPTH_LEDGER.md";
            if (!fs.existsSync(ledgerPath)) { console.log("DEPTH_LEDGER.md 不存在——生产仓库跳过 ledger_item 校验"); process.exit(0); }
            const text = fs.readFileSync(ledgerPath, "utf8");
            const sectionC = (text.split("## §C")[1] || "");
            const id = lines.ledger_item.replace(/[`*]/g, "");
            const rowRe = new RegExp("^\\|\\s*" + id.replace(/[.*+?^${}()|[\\]\\\\]/g, "\\\\$&") + "\\b.*?\\|\\s*(\\w+)\\s*\\|", "m");
            const rowMatch = sectionC.match(rowRe);
            if (!rowMatch) fail("ledger_item `" + id + "` 未在 DEPTH_LEDGER.md §C 找到（合法 id 见该表 id 列）");
            if (rowMatch[1] === "WIRED_GREEN") {
              fail("ledger_item `" + id + "` 已 WIRED_GREEN——禁对已 closed item 提 PR 凑数。取 §A next_action。");
            }
            // R9: body 声称的 src/ path 须至少一个 ∈ PR changed-files（防 body 谎报接线目标）。
            // 提取所有 src/<path> token，剥 :line 后缀，去重。
            const bodySrcPaths = [...lines.single_real_dependency.matchAll(/src\/[A-Za-z0-9_./-]+/g)]
              .map((m) => m[0].replace(/:.*$/, ""))
              .filter(Boolean);
            const uniqueBodySrc = [...new Set(bodySrcPaths)];
            if (changedFiles.length === 0) {
              // gh api 拉取失败（fork PR 权限 / 限流 / PR 改 0 文件不可能）→ WARN 跳过，不阻断。
              // depth_gate（独立 CI job）的 AST caller 计数是真后盾；R9 是 body↔diff 一致性的纵深层。
              warn("R9 跳过：gh api changed-files 拉取为空（fork PR 权限 / 限流）——depth_gate AST 是真接线后盾。");
            } else if (uniqueBodySrc.length > 0) {
              const hit = uniqueBodySrc.find((p) => changedFiles.includes(p));
              if (!hit) {
                const changedSrc = changedFiles.filter((f) => f.startsWith("src/"));
                fail(
                  "single_real_dependency 声称接线 " + uniqueBodySrc.join(", ") +
                  " 但 PR diff 不含其中任一（body ↔ diff 不一致——疑似谎报接线目标逃避 entry 协议）。" +
                  "changed src/ 文件: " + (changedSrc.length ? changedSrc.join(", ") : "(无 src/ 改动)")
                );
              }
            }
            console.log("✓ entry_protocol_check PASS: ledger_item=" + id + " (status=" + rowMatch[1] + "), single_real_dependency 含真实依赖 + src/ 路径" + (changedFiles.length ? " + src path ∈ changed-files (R9)" : " (R9 skipped)"));
          '
