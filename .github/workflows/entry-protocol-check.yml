# .github/workflows/entry-protocol-check.yml
# 入口协议 PR-body 校验（AGENT_ENTRY_PROTOCOL.md 步骤 2 + AGENT_ANTISKIM_TRIPWIRES.md T7/T8 机检钩子）
#
# 目的：把「agent 是否一句话陈述了单一真实依赖 + ledger_item」从软规则变成 PR-level 硬门。
#   PR body 须含两行（机器 grep，关键词不命中 → exit 1）：
#     ledger_item: <id>            —— id 须在 DEPTH_LEDGER §C 存在且 status ≠ WIRED_GREEN
#     single_real_dependency: <…>  —— 须含真实依赖关键词 symPy|dashscope|venv|hash 之一 + src/ path
#
# ⚠️ maintainer 必做：把 `entry_protocol_check` 加入 Branch protection → Require status checks。
#
# 仅 PR 触发（push 无 PR body）。零依赖（bash + node 内置 grep）。
# agent 无关：对所有 commit 来源等价（Claude/GPT/Cursor/Copilot 提 PR 均被校验）。
name: entry-protocol-check

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read

jobs:
  entry_protocol_check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Validate PR body has ledger_item + single_real_dependency
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          set -e
          node -e '
            const fs = require("node:fs");
            const body = process.env.PR_BODY || "";
            const lines = { ledger_item: "", single_real_dependency: "" };
            for (const line of body.split(/\r?\n/)) {
              const m1 = line.match(/^\s*ledger_item\s*:\s*(\S+)/i);
              if (m1) lines.ledger_item = m1[1];
              const m2 = line.match(/^\s*single_real_dependency\s*:\s*(.+)/i);
              if (m2) lines.single_real_dependency = m2[1];
            }
            const fail = (msg) => { console.error("✗ entry_protocol_check FAIL: " + msg); process.exit(1); };
            if (!lines.ledger_item) fail("PR body 缺 `ledger_item: <id>`（须为 DEPTH_LEDGER.md §C 中一个 id）");
            if (!lines.single_real_dependency) fail("PR body 缺 `single_real_dependency: <…>` 行");
            const dep = lines.single_real_dependency.toLowerCase();
            if (!/sympy|dashscope|venv|hash/.test(dep)) {
              fail("single_real_dependency 须含真实依赖关键词之一：symPy / dashscope / venv / hash。实际: " + lines.single_real_dependency);
            }
            if (!/src\//.test(lines.single_real_dependency)) {
              fail("single_real_dependency 须含 src/ 路径（被接线的生产 file:line）。实际: " + lines.single_real_dependency);
            }
            // 校验 ledger_item id 在 §C 存在 + 非 WIRED_GREEN（禁对已 closed item 提 PR 凑数）
            const ledgerPath = "PROJECT_PLAN/DEPTH_LEDGER.md";
            if (!fs.existsSync(ledgerPath)) fail("PROJECT_PLAN/DEPTH_LEDGER.md 不存在");
            const text = fs.readFileSync(ledgerPath, "utf8");
            const sectionC = (text.split("## §C")[1] || "");
            const id = lines.ledger_item.replace(/[`*]/g, "");
            const rowRe = new RegExp("^\\|\\s*" + id.replace(/[.*+?^${}()|[\\]\\\\]/g, "\\\\$&") + "\\b.*?\\|\\s*(\\w+)\\s*\\|", "m");
            const rowMatch = sectionC.match(rowRe);
            if (!rowMatch) fail("ledger_item `" + id + "` 未在 DEPTH_LEDGER.md §C 找到（合法 id 见该表 id 列）");
            if (rowMatch[1] === "WIRED_GREEN") {
              fail("ledger_item `" + id + "` 已 WIRED_GREEN——禁对已 closed item 提 PR 凑数。取 §A next_action。");
            }
            console.log("✓ entry_protocol_check PASS: ledger_item=" + id + " (status=" + rowMatch[1] + "), single_real_dependency 含真实依赖 + src/ 路径");
          '
