name: ci

# Quality gate for every push and PR: the same deterministic checks the local
# harness runs (AGENTS.md §2/§8) — typecheck, lint, full vitest suite (incl. the
# real-uv experiment sidecar), TUI package tests, CLI smoke, secret/path scans,
# license ledger, and the web production build (which typechecks first).
# No live model routes are touched: tests are offline by design; any test that
# would need a live route fails there just as it would locally.

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# @huggingface/transformers carries onnxruntime-node for server consumers. Its
# Linux installer otherwise downloads optional CUDA providers although FAR-Lab's
# Web build uses onnxruntime-web. Keep CI/source verification CPU/browser-only.
env:
  ONNXRUNTIME_NODE_INSTALL: skip

jobs:
  verify:
    name: Verify (${{ matrix.os }})
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24.18.0'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json
            packages/tui/package-lock.json
            desktop/package-lock.json
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: '0.12.1'
          enable-cache: true
      - name: Install root dependencies
        run: npm ci
      # Root vitest suite imports web/src modules (dictation, ingest, lit-graph
      # tests) — web deps must exist BEFORE `npm test`, not only for the build.
      - name: Install web dependencies
        working-directory: web
        run: npm ci
      # TUI package tests run on the node test runner over TypeScript sources.
      - name: Install TUI dependencies
        working-directory: packages/tui
        run: npm ci
      - name: Install desktop dependencies
        working-directory: desktop
        run: npm ci
      # eval/*.mjs scripts (rediscovery-judge, retrieval-baseline tests) import
      # compiled dist/ — the suite needs a real build, not just typecheck.
      - name: Build backend dist
        run: npm run build
      # Experiment sidecar bootstrap scripts run `python -c "import numpy..."`;
      # use the same explicit interpreter on Linux, Windows and macOS.
      - name: Install python deps for the experiment sidecar
        run: python -m pip install "numpy>=2.4,<3" --quiet  # pinned to the uv.lock family (experiment-runtime/uv.lock resolves 2.4.x/2.5.x)
      - name: Typecheck (backend + CLI)
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Full test suite (deterministic; real uv sidecar for experiments)
        run: npm test
      - name: TUI package tests
        working-directory: packages/tui
        run: npm test
      - name: CLI smoke (offline help path)
        run: node dist/cli/main.js --help
      # FA-PRF-02: backend percentile gate on the canonical Linux cell (real
      # paths: cold start, createApp, API surface, 15k-event store ops, kernel
      # turn machinery). Thresholds p95, provisional until tightened against
      # hosted artifacts (evidence/reliability/perf-gate.json in the log).
      - name: Backend perf gate (p50/p95/p99 thresholds)
        if: matrix.os == 'ubuntu-latest'
        run: node scripts/perf-gate.mjs --ci
      - name: License ledger gate (copyleft + committed-ledger drift)
        run: node zcode-harness/scripts/license-ledger.mjs --check
      - name: Secret scan
        run: node zcode-harness/scripts/secret-scan.mjs
      - name: Path hygiene
        run: node zcode-harness/scripts/path-hygiene.mjs
      # web build script = typecheck && vite build, so this step also enforces
      # web typechecking.
      - name: Web production build
        working-directory: web
        run: npm run build

  # The experiment runtime declares Python >=3.11 and ships one uv lock. Verify
  # both release-targeted minor versions against that lock instead of inferring
  # compatibility from the main 3.12 job.
  python-runtime:
    name: Python runtime (${{ matrix.python }})
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12']
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: '0.12.1'
          enable-cache: true
      - name: Sync the locked runtime
        run: uv sync --locked --project experiment-runtime --python "${{ matrix.python }}"
      - name: Import the complete scientific runtime from the frozen environment
        run: uv run --project experiment-runtime --frozen --python "${{ matrix.python }}" python -c "import sys, farlab_experiment_runtime, cleanlab, numpy, scipy, sklearn, sympy, xarray, netCDF4; expected=tuple(map(int, '${{ matrix.python }}'.split('.'))); assert sys.version_info[:2] == expected, (sys.version, expected); print(sys.version); print('numpy', numpy.__version__, 'scipy', scipy.__version__)"
      - name: Run experiment runtime unit tests
        run: uv run --project experiment-runtime --frozen --python "${{ matrix.python }}" python -m unittest discover -s experiment-runtime/tests -p 'test_*.py' -v

  # FA-SEC-01: CodeAct is a real OCI capability. Missing Docker/image/runtime
  # facts fail this job; no host-side fallback and no skip can become evidence.
  exploration-sandbox:
    name: Exploration OCI sandbox
    timeout-minutes: 25
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24.18.0'
          cache: npm
      - name: Install root dependencies
        run: npm ci
      - name: Build immutable exploration runtime image
        run: npm run sandbox:build
      - name: Record hosted source and immutable image identity
        id: sandbox_identity
        shell: bash
        run: |
          set -euo pipefail
          image_ref='farlab-experiment-runtime:sec01'
          source_sha="$(git rev-parse HEAD)"
          if [ "$source_sha" != "$GITHUB_SHA" ]; then
            printf 'checked-out SHA %s does not match GITHUB_SHA %s\n' "$source_sha" "$GITHUB_SHA" >&2
            exit 1
          fi
          image_id="$(docker image inspect "$image_ref" --format '{{.Id}}')"
          if [[ ! "$image_id" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            printf 'Docker image ID is not a full sha256 digest: %s\n' "$image_id" >&2
            exit 1
          fi
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          printf 'FA-SEC-01 hosted workflow run: %s\n' "$run_url"
          printf 'FA-SEC-01 hosted source SHA: %s\n' "$source_sha"
          printf 'FA-SEC-01 hosted image ID: %s\n' "$image_id"
          {
            printf 'source_sha=%s\n' "$source_sha"
            printf 'image_id=%s\n' "$image_id"
            printf 'run_url=%s\n' "$run_url"
          } > "$RUNNER_TEMP/fa-sec-01-identity.txt"
          printf 'FARLAB_EXPLORATION_SANDBOX_IMAGE=%s\n' "$image_id" >> "$GITHUB_ENV"
          {
            printf '### FA-SEC-01 hosted OCI identity\n\n'
            printf -- '- Workflow run: `%s`\n' "$run_url"
            printf -- '- Source SHA: `%s`\n' "$source_sha"
            printf -- '- Image ID: `%s`\n' "$image_id"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Verify Docker policy and in-container attestation
        run: |
          set -euo pipefail
          npm run sandbox:verify 2>&1 | tee "$RUNNER_TEMP/fa-sec-01-verifier.log"
      - name: Execute the production explore_code path
        env:
          FARLAB_VERIFY_EXPLORATION_SANDBOX: '1'
        run: npx vitest run tests/exploration-feasibility.test.ts tests/research-tools.test.ts tests/exploration-sandbox-contract.test.ts tests/exploration-sandbox-verifier.test.ts
      - name: Attack the live OCI boundaries and timeout cleanup
        env:
          FARLAB_VERIFY_EXPLORATION_SANDBOX: '1'
          FARLAB_SEC01_EVIDENCE_FILE: ${{ runner.temp }}/fa-sec-01-adversarial-evidence.txt
        run: |
          set -euo pipefail
          npx vitest run tests/exploration-sandbox-adversarial.test.ts 2>&1 | tee "$RUNNER_TEMP/fa-sec-01-adversarial.log"
      - name: Assert cleanup and publish hosted FA-SEC-01 evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          failed=0
          docker_query_failed=0
          if ! exploration_leftovers="$(docker ps -aq --filter name=^farlab-exploration-)"; then
            exploration_leftovers='docker query failed'
            docker_query_failed=1
          fi
          if ! verifier_leftovers="$(docker ps -aq --filter name=^farlab-sec01-)"; then
            verifier_leftovers='docker query failed'
            docker_query_failed=1
          fi
          if [ "$docker_query_failed" -ne 0 ]; then
            printf 'Unable to inspect sandbox containers after the job\n' >&2
            failed=1
          elif [ -n "$exploration_leftovers" ] || [ -n "$verifier_leftovers" ]; then
            printf 'Sandbox containers survived cleanup:\n%s\n%s\n' "$exploration_leftovers" "$verifier_leftovers"
            failed=1
          else
            printf 'FA-SEC-01 container cleanup: exploration=0 verifier=0\n'
          fi
          proc_evidence=''
          if [ -f "$RUNNER_TEMP/fa-sec-01-adversarial-evidence.txt" ]; then
            proc_evidence="$(grep -F 'FA-SEC-01 Linux /proc attach-client cleanup:' "$RUNNER_TEMP/fa-sec-01-adversarial-evidence.txt" | tail -n 1 || true)"
          fi
          if [ -z "$proc_evidence" ]; then
            printf 'Missing Linux /proc attach-client cleanup evidence from the adversarial test\n' >&2
            failed=1
          else
            printf '%s\n' "$proc_evidence"
          fi
          {
            printf '### FA-SEC-01 hosted cleanup evidence\n\n'
            printf -- '- Containers: exploration=%s verifier=%s\n' "${exploration_leftovers:-0}" "${verifier_leftovers:-0}"
            if [ -n "$proc_evidence" ]; then
              printf -- '- Linux `/proc` attach-client: `%s`\n' "$proc_evidence"
            else
              printf -- '- Linux `/proc` attach-client: **MISSING**\n'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$failed"
      - name: Upload hosted FA-SEC-01 evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fa-sec-01-oci-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/fa-sec-01-identity.txt
            ${{ runner.temp }}/fa-sec-01-verifier.log
            ${{ runner.temp }}/fa-sec-01-adversarial.log
            ${{ runner.temp }}/fa-sec-01-adversarial-evidence.txt
          if-no-files-found: ignore
          retention-days: 14

  # Network-backed advisory queries run once on Ubuntu against every shipped
  # npm lock. A registry outage is a visible gate failure, not a false green.
  dependency-audit:
    name: Dependency audit (${{ matrix.package }})
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: root
            directory: .
          - package: web
            directory: web
          - package: tui
            directory: packages/tui
          - package: desktop
            directory: desktop
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24.18.0'
          package-manager-cache: false
      - name: Reject high/critical production dependency advisories
        working-directory: ${{ matrix.directory }}
        run: npm audit --package-lock-only --omit=dev --audit-level=high --registry=https://registry.npmjs.org

  # Multi-language SAST is intentionally independent of build/test jobs. The
  # repository contains real product code in TS/JS, Python and Rust, plus the
  # privileged release workflow itself; each gets its own CodeQL database.
  codeql:
    name: CodeQL (${{ matrix.language }})
    timeout-minutes: 45
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [actions, javascript-typescript, python, rust]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Initialize CodeQL
        uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-extended
      - name: Analyze
        uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          category: /language:${{ matrix.language }}

  # HX §19: browser E2E over the Research Map core journey (home -> formation
  # -> launch -> study map -> inspector -> home) on the deterministic offline
  # route. Chromium owns the complete suite; Firefox and Playwright WebKit on
  # Ubuntu independently exercise the core journey plus optional PDF/ASR
  # boundaries. This WebKit lane is cross-engine web evidence, not a Safari or
  # macOS WKWebView claim. A retry-recovered test still fails the job so CI
  # cannot launder a product race as green.
  web-e2e:
    name: Web E2E (${{ matrix.browser }} / ${{ matrix.scope }})
    needs: verify
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - browser: chromium
            scope: full
          - browser: firefox
            scope: smoke
          - browser: webkit
            scope: smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24.18.0'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json
      - name: Install root deps
        run: npm ci
      - name: Build root dist
        run: npm run build
      - name: Install web deps
        working-directory: web
        run: npm ci
      - name: Build web dist
        working-directory: web
        run: npm run build
      - name: Install Playwright browser
        working-directory: web
        run: npx playwright install --with-deps ${{ matrix.browser }}
      - name: Run full Chromium E2E (offline deterministic route)
        if: matrix.scope == 'full'
        working-directory: web
        run: npx playwright test --project=chromium --workers=1 --fail-on-flaky-tests
      - name: Run cross-engine core + optional-capability smoke
        if: matrix.scope == 'smoke'
        working-directory: web
        run: npx playwright test e2e/core-journey.spec.ts e2e/optional-assets.spec.ts --project=${{ matrix.browser }} --workers=1 --retries=0
      - name: Upload browser failure evidence
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-${{ matrix.browser }}-${{ github.run_attempt }}
          path: web/test-results/
          if-no-files-found: ignore
          retention-days: 14

  # Native compilation evidence on every claimed desktop platform. These
  # bundles are deliberately labelled compile-only: the current shell locates
  # the source tree at compile time and launches a system Node process, so it is
  # not yet a standalone distributable application (desktop/BUILD_SCOPE.md).
  desktop-build:
    name: Desktop compile-only (${{ matrix.platform }})
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            platform: linux-x64
            bundles: deb,appimage
            required_suffixes: '.deb,.AppImage'
            apple_signing_identity: ''
          - os: windows-latest
            platform: windows-x64
            bundles: nsis
            required_suffixes: '-setup.exe'
            apple_signing_identity: ''
          - os: macos-15
            platform: macos-arm64
            bundles: dmg
            required_suffixes: '.dmg'
            apple_signing_identity: '-'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Linux WebKit and bundle prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf xdg-utils
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24.18.0'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json
            desktop/package-lock.json
      - name: Install exact Rust toolchain
        run: rustup toolchain install 1.98.0 --profile minimal --no-self-update
      - name: Install and build the web frontend
        working-directory: web
        run: |
          npm ci
          npm run build
      - name: Build the backend and stage the desktop sidecar
        run: |
          npm ci
          npm run build
          node desktop/scripts/stage-sidecar.mjs
      - name: Install desktop CLI
        working-directory: desktop
        run: npm ci
      - name: Run native Rust tests
        working-directory: desktop/src-tauri
        run: cargo +1.98.0 test --locked
      - name: Compile native desktop bundles
        working-directory: desktop
        env:
          APPLE_SIGNING_IDENTITY: ${{ matrix.apple_signing_identity }}
        run: npm run tauri -- build --ci --bundles ${{ matrix.bundles }} -- --locked
      - name: Assert requested bundle formats exist
        working-directory: desktop
        run: node scripts/assert-bundle-formats.mjs src-tauri/target/release/bundle "${{ matrix.required_suffixes }}"
      - name: Upload compile-only desktop evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: desktop-compile-only-${{ matrix.platform }}-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            desktop/BUILD_SCOPE.md
            desktop/src-tauri/target/release/bundle/
          if-no-files-found: error
          retention-days: 14

  # Release artifact: the public-release pack is built only on explicit demand
  # (tag push or manual dispatch) because export-public.mjs re-verifies the
  # copy with a fresh install + typecheck + lint + test + build inside it.
  release-pack:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: [verify, python-runtime, exploration-sandbox, web-e2e, desktop-build, dependency-audit, codeql]
    timeout-minutes: 120
    runs-on: ubuntu-latest
    permissions:
      actions: read
      attestations: write
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24.18.0'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json
            packages/tui/package-lock.json
            desktop/package-lock.json
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: '0.12.1'
          enable-cache: true
      - name: Fail closed on tag/version/changelog drift
        if: startsWith(github.ref, 'refs/tags/v')
        run: node scripts/check-release-tag.mjs
      - name: Build public-release pack (self-verifying exporter)
        run: node scripts/export-public.mjs
      - name: Generate multi-ecosystem CycloneDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: build/public-release
          format: cyclonedx-json
          output-file: build/release-sbom.cdx.json
          syft-version: v1.51.0
          upload-artifact: false
          upload-release-assets: false
      - name: Build deterministic archive, manifest and checksums
        id: artifacts
        run: node scripts/build-release-artifacts.mjs
      - name: Sign build provenance
        id: provenance
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with:
          subject-path: |
            ${{ steps.artifacts.outputs.archive }}
            ${{ steps.artifacts.outputs.manifest }}
            ${{ steps.artifacts.outputs.sbom }}
            ${{ steps.artifacts.outputs.notes }}
            ${{ steps.artifacts.outputs.checksums }}
      - name: Sign SBOM attestation
        id: sbom-attestation
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with:
          subject-path: ${{ steps.artifacts.outputs.archive }}
          sbom-path: ${{ steps.artifacts.outputs.sbom }}
      - name: Verify hosted provenance against the repository
        env:
          ARCHIVE_PATH: ${{ steps.artifacts.outputs.archive }}
          CHECKSUMS_PATH: ${{ steps.artifacts.outputs.checksums }}
          GH_TOKEN: ${{ github.token }}
        run: |
          gh attestation verify "$ARCHIVE_PATH" --repo "$GITHUB_REPOSITORY"
          gh attestation verify "$CHECKSUMS_PATH" --repo "$GITHUB_REPOSITORY"
      - name: Add signed bundles (preserve the attested SHA256SUMS bytes)
        env:
          PROVENANCE_BUNDLE: ${{ steps.provenance.outputs.bundle-path }}
          SBOM_BUNDLE: ${{ steps.sbom-attestation.outputs.bundle-path }}
        run: node scripts/finalize-release-attestations.mjs
      - name: Independent artifact verification smoke
        run: node scripts/verify-release-artifacts.mjs build/release
      - name: Upload attested release candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: farlab-public-release-${{ github.sha }}
          path: build/release/
          if-no-files-found: error
          retention-days: 30
      - name: Publish GitHub Release (tag builds only)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_NOTES: ${{ steps.artifacts.outputs.notes }}
        run: gh release create "$RELEASE_TAG" build/release/* --verify-tag --title "FAR-Lab $RELEASE_TAG" --notes-file "$RELEASE_NOTES"
