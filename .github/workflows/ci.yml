name: ci

# Quality gate for every push and PR: the same deterministic checks the local
# harness runs (AGENTS.md §2/§8) — typecheck, lint, full vitest suite (incl. the
# real-uv experiment sidecar), TUI package tests, CLI smoke, secret/path scans,
# license ledger, and the web production build (which typechecks first).
# No live model routes are touched: tests are offline by design; any test that
# would need a live route fails there just as it would locally.

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    name: Verify (${{ matrix.os }})
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install root dependencies
        run: npm ci
      # Root vitest suite imports web/src modules (dictation, ingest, lit-graph
      # tests) — web deps must exist BEFORE `npm test`, not only for the build.
      - name: Install web dependencies
        working-directory: web
        run: npm ci
      # TUI package tests run on the node test runner over TypeScript sources.
      - name: Install TUI dependencies
        working-directory: packages/tui
        run: npm ci
      - name: Install desktop dependencies
        working-directory: desktop
        run: npm ci
      # eval/*.mjs scripts (rediscovery-judge, retrieval-baseline tests) import
      # compiled dist/ — the suite needs a real build, not just typecheck.
      - name: Build backend dist
        run: npm run build
      # Experiment sidecar bootstrap scripts run `python -c "import numpy..."`;
      # use the same explicit interpreter on Linux and Windows.
      - name: Install python deps for the experiment sidecar
        run: python -m pip install "numpy>=2.4,<3" --quiet  # pinned to the uv.lock family (experiment-runtime/uv.lock resolves 2.4.x/2.5.x)
      - name: Typecheck (backend + CLI)
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Full test suite (deterministic; real uv sidecar for experiments)
        run: npm test
      - name: TUI package tests
        working-directory: packages/tui
        run: npm test
      - name: CLI smoke (offline help path)
        run: node dist/cli/main.js --help
      - name: License ledger gate (copyleft + committed-ledger drift)
        run: node zcode-harness/scripts/license-ledger.mjs --check
      - name: Secret scan
        run: node zcode-harness/scripts/secret-scan.mjs
      - name: Path hygiene
        run: node zcode-harness/scripts/path-hygiene.mjs
      # web build script = typecheck && vite build, so this step also enforces
      # web typechecking.
      - name: Web production build
        working-directory: web
        run: npm run build

  # HX §19: browser E2E over the Research Map core journey (home -> formation
  # -> launch -> study map -> inspector -> home) on the deterministic offline
  # route. Chromium owns the complete suite; Firefox independently exercises
  # the core journey plus optional PDF/ASR boundaries. A retry-recovered test
  # still fails the job so CI cannot launder a product race as green.
  web-e2e:
    name: Web E2E (${{ matrix.browser }} / ${{ matrix.scope }})
    needs: verify
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - browser: chromium
            scope: full
          - browser: firefox
            scope: smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install root deps
        run: npm ci
      - name: Build root dist
        run: npm run build
      - name: Install web deps
        working-directory: web
        run: npm ci
      - name: Build web dist
        working-directory: web
        run: npm run build
      - name: Install Playwright browser
        working-directory: web
        run: npx playwright install --with-deps ${{ matrix.browser }}
      - name: Run full Chromium E2E (offline deterministic route)
        if: matrix.scope == 'full'
        working-directory: web
        env:
          PLAYWRIGHT_CHANNEL: ''
        run: npx playwright test --browser=chromium --workers=1 --fail-on-flaky-tests
      - name: Run Firefox core + optional-capability smoke
        if: matrix.scope == 'smoke'
        working-directory: web
        env:
          PLAYWRIGHT_CHANNEL: ''
        run: npx playwright test e2e/core-journey.spec.ts e2e/optional-assets.spec.ts --browser=firefox --workers=1 --retries=0
      - name: Upload browser failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-${{ matrix.browser }}-${{ github.run_attempt }}
          path: web/test-results/
          if-no-files-found: ignore
          retention-days: 14

  # Release artifact: the public-release pack is built only on explicit demand
  # (tag push or manual dispatch) because export-public.mjs re-verifies the
  # copy with a fresh install + typecheck + lint + test + build inside it.
  release-pack:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: [verify, web-e2e]
    timeout-minutes: 90
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install root dependencies
        run: npm ci
      - name: Install web dependencies (release copy ships web sources)
        working-directory: web
        run: npm ci
      - name: Install TUI dependencies (release copy ships the TUI package)
        working-directory: packages/tui
        run: npm ci
      - name: Install python deps for the experiment sidecar
        run: python -m pip install "numpy>=2.4,<3" --quiet  # pinned to the uv.lock family (experiment-runtime/uv.lock resolves 2.4.x/2.5.x)
      - name: Build public-release pack (self-verifying exporter)
        run: node scripts/export-public.mjs
      - name: Upload release pack
        uses: actions/upload-artifact@v4
        with:
          name: farlab-public-release
          path: build/public-release/
          if-no-files-found: error
