# FAR-Lab CI — 12 步串行 gate + competition_qwen_smoke 条件门 + C8 每日 snapshot 存活监控
# 运行时 SSOT 以本 workflow + package.json 为准
# 作用域：对抗 LLM 幻觉的工程化兜底。cross_lang 是 R2 最高优先闸门。
# 命名约定：job id 一律下划线（不用连字符），因 needs.<job_id>.result 表达式里连字符会被解析为减号
# Action 版本锁：2026 node24 时代（checkout@v5 / setup-node@v6 / setup-python@v6 / pnpm/action-setup@a8198c4bff370c8506180b035930dea56dbd5288）
# 命令适配说明（相对早期 CI 设计的偏差·均因既有 package.json/pyproject.toml 实际配置）：
#   - lint：已配 eslint（eslint.config.js · 零容忍 Z1/Z2/Z3 + argsIgnorePattern '^_'）→ STEP3 跑 `pnpm run lint`
#   - py_typecheck：pyproject.toml dev 依赖未含 mypy/ruff → 改用 `python -m compileall` 做语法闸门
#   - test_ts / test_registry：package.json 用 `node --test`（非 vitest）→ 用 `pnpm run test`
#   - test_py：package.json 用 unittest（非 pytest）→ 用 `pnpm run test:py`
#   - repro_check：无 Makefile → 用 `pnpm run test:py`
#   - cross_lang：既有测试位于 tests/evidence_log/cross_lang_consistency.test.ts（非 tests/ci/）→ 直接 node --test 该文件
#   - migration：V1 裁定不交付可运行迁移机（R-MIG V2 占位红·不假装能跑通）
#                → forward migrate up [0001-0008] + up 幂等
#                + append-only trigger 拦截 落 test_ts 全量跑（gate 落点见 STEP 5 注释）
#   - competition_qwen_smoke：ci/competition_qwen_smoke.ts 已实现；无 key 时条件门 skip 不 block
name: FAR-Lab CI

on:
  # Default branch is `main`. PRs trigger CI regardless of target branch so the
  # 12-step gate always runs (highest-priority invariant R2).
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# 同一 ref 的新 push 取消旧 run（省额度，防并发写入 repro_runs）
concurrency:
  # 加 github.event_name：隔离 schedule 触发的 C8 snapshot 监控 run，避免 push 到 main 取消每日定时检查
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # pnpm 版本须对齐 package.json packageManager SSOT（pnpm@10.29.3）·避免 CI（pnpm9）与 fresh-clone（corepack pnpm10）install 行为漂移
  PNPM_VERSION: '10.29.3'
  NODE_VERSION: '24'   # CI runner 自身 Node（非项目 TS 编译目标）
  PYTHON_VERSION: '3.11'
  # Node ≥24 V8 compile cache 默认写 <cwd>/0/（若 NODE_COMPILE_CACHE 未设或为相对路径）→
  # 指向仓库外绝对路径，防止工作树生成 0/（卫生门禁 compile_cache_no_leak 检查）
  # 注意：顶层 env 仅支持 github/secrets/inputs/vars 上下文，不可用 runner.temp（会导致 workflow 解析失败）；
  # CI 全 ubuntu runner，/tmp 即仓库外临时目录，语义等价。
  NODE_COMPILE_CACHE: '/tmp/node-compile-cache'

jobs:
  # ============================================================
  # STEP 1 · install（前置脚手架，失败 block 全部）
  # ============================================================
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0   # release_check 需 tags + 完整历史
      - uses: pnpm/action-setup@a8198c4bff370c8506180b035930dea56dbd5288
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: pyproject.toml
      - name: Install pnpm deps (frozen)
        run: pnpm install --frozen-lockfile
      - name: Install python deps
        run: |
          python -m pip install --upgrade pip
          pip install -e .
      - name: Verify scaffolding exists (ENOENT 早失败)
        run: |
          test -f tsconfig.json
          test -f pyproject.toml
          test -d src
          test -d repro

  # ============================================================
  # REPO_HYGIENE · tracked 内容门禁（A–I 9 项递归扫描 · 零依赖零 install）
  # 置于最前：FINAL_REPORT.md / AGENT_SUMMARY.md 等过程文件一进 index 立即红，
  # 不等重型测试跑完才发现。SSOT = scripts/repo_hygiene_gate.mjs（与 .gitignore 同源）。
  # ============================================================
  repo_hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: repo hygiene gate (tracked content policy · A-I 9 gates)
        run: node scripts/repo_hygiene_gate.mjs

  # ============================================================
  # FRONTEND GATE · frontend（React+Vite 仪表盘·npm 独立工作区·与后端串行链并行）
  # frontend/ 有独立 package-lock.json（非 root pnpm workspace 成员）→ 用 npm ci
  #   - --legacy-peer-deps：eslint@10 与 eslint-plugin-react@7.37 的 peer 元数据过时
  #     （运行时兼容·本地 pnpm 默认忽略 peer·npm 严格模式需显式 --legacy-peer-deps 复现）
  #   - typecheck 用 tsc -b（非 --noEmit）：tsconfig.json 项目引用下 --noEmit 触发
  #     TS6305（引用工程 vite.config.d.ts 产物在 fresh install 缺失·tsc -b 先构建引用工程·与 build 一致）
  # 职责：typecheck + lint + vitest(123) + vite build 全绿（[J] 前端覆盖率门禁）
  # ============================================================
  frontend:
    needs: install
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0   # release_check 需 tags + 完整历史
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: npm ci (frozen install via package-lock.json · --legacy-peer-deps 见上注)
        run: npm ci --legacy-peer-deps
      - name: typecheck (tsc -b · 项目引用感知)
        run: npm run typecheck
      - name: lint (eslint src --ext .ts,.tsx)
        run: npm run lint
      - name: test (vitest run · 123 例)
        run: npm run test
      - name: build (tsc -b && vite build)
        run: npm run build

  # ============================================================
  # STEP 2 · typecheck（零容忍闸门 #1：tsc --noEmit，失败 block 之后全部）
  # ============================================================
  typecheck:
    needs: install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0   # release_check 需 tags + 完整历史
      - uses: pnpm/action-setup@a8198c4bff370c8506180b035930dea56dbd5288
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - name: tsc --noEmit (zero-tolerance gate)
        run: pnpm exec tsc --noEmit

  # ============================================================
  # STEP 3 · lint（零容忍闸门 #2：eslint src --max-warnings 0 · eslint.config.js 零容忍规则）
  # ============================================================
  lint:
    needs: typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0   # release_check 需 tags + 完整历史
      - uses: pnpm/action-setup@a8198c4bff370c8506180b035930dea56dbd5288
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - name: ESLint (zero-tolerance gate #2: eslint src --max-warnings 0)
        run: pnpm run lint

  # ============================================================
  # STEP 4 · py_typecheck（零容忍闸门 #3：mypy/ruff 未在 dev 依赖 → compileall 语法闸门）
  # ============================================================
  py_typecheck:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0   # release_check 需 tags + 完整历史
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: pyproject.toml
      - run: |
          python -m pip install --upgrade pip
          pip install -e .
      - name: Python 语法闸门 (mypy/ruff 待加入 dev 依赖；暂用 compileall)
        run: python -m compileall -q repro/

  # ============================================================
  # STEP 5 · test_ts（node --test TS 单元 + 集成；含 cross_lang 需 python3）
  # ------------------------------------------------------------
  # migration gate 落点（诚实声明）：
  #   V1 裁定"不交付可运行迁移机（R-MIG 占位红·不假装能跑通）"
  #   ——故 migrate down / up-down-up 完整幂等属 V2。
  #   V1 实际覆盖（本 step 全量跑，非假绿·非混入式免责）：
  #     · forward migrate up [0001-0008]：tests/schema/db_migrator.test.ts runMigrations applies [1..8]
  #     · up 幂等（up→up 不变）：db_migrator.test.ts 'skips already applied versions' → skipped [1..8]
  #     · contiguous version gap 拦截：db_migrator.test.ts 'rejects version gaps before executing SQL'
  #     · append-only trigger 拦截（R1/R7）：tests/evidence_log/append_verify.test.ts
  #       DROP TRIGGER trg_call_records_no_update + UPDATE 篡改 → verifyChainHead 检测（证明 trigger 存在且拦截）
  #   migrate down / up-down-up 完整幂等 = V2 R-MIG（V1 不交付可运行迁移机）。
  # ============================================================
  test_ts:
    needs: py_typecheck
    runs-on: ubuntu-latest
    # CI 韧性（2026-08-07，run 31186354000 曾无 timeout 卡 58min）：job 级 30min 上限自愈。
    # 配合下方 3 分片 step：任一分片挂 → 该 step 超时红 + tail 日志可见具体挂点，而非整 job 无输出。
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0   # release_check 需 tags + 完整历史
      - uses: pnpm/action-setup@a8198c4bff370c8506180b035930dea56dbd5288
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: pyproject.toml
      - run: pnpm install --frozen-lockfile
      - run: |
          python -m pip install --upgrade pip
          pip install -e .
          # 审计 P1-8：science_harness 的 40+ 测试（sandbox/seed_cherry/secret_strip/bls_pipeline/c_astro）
          # 依赖 numpy/lightkurve——缺装则 t.skip() 静默降级，CI 显示 green 但关键路径未真覆盖。
          pip install numpy lightkurve
      - name: perf_budget timer start (test 墙钟计时原点·b6-S2)
        run: echo "PERF_TEST_WALL_START_MS=$(date +%s%3N)" >> "$GITHUB_ENV"
      - name: ensure native + python deps prelude (package.json test 前置三连)
        run: node scripts/ensure_native_deps.mjs && node scripts/ensure_py_deps.mjs && node scripts/python_axis_probe.mjs
      # 分片说明（2026-08-07）：原单步 `pnpm run test`（27 glob 一进程）在 CI 上整体卡死且零输出。
      # 拆 3 片 → 每片独立进程 + --test-timeout（per-test 180s 兜底）+ pipefail + tail（尾部 8KB
      # 结果摘要落日志）。glob 全集与 package.json test 脚本完全一致，零丢测试。
      # shard 1 前置最可疑目录（evidence_log 跨语言 Python spawn 已逐一加 30s spawnSync 超时）。
      - name: node --test shard 1/3 (api·llm_gateway·schema·evidence_log·falsifiability·fec·math·statistics·golden_vectors)
        run: |
          set -o pipefail
          node --test --test-timeout=180000 \
            tests/api/*.test.ts tests/llm_gateway/*.test.ts tests/schema/*.test.ts \
            tests/evidence_log/*.test.ts tests/falsifiability/*.test.ts tests/fec/*.test.ts \
            tests/math/*.test.ts tests/statistics/*.test.ts tests/golden_vectors/*.test.ts \
            2>&1 | tail -c 8000
      - name: node --test shard 2/3 (real_backends·demo_seeds·benchmark·db·far_proof·science_harness·adapters)
        run: |
          set -o pipefail
          node --test --test-timeout=180000 \
            tests/real_backends/*.test.ts tests/demo_seeds/*.test.ts tests/benchmark/*.test.ts \
            tests/db/*.test.ts tests/far_proof/*.test.ts \
            tests/science_harness/*.test.ts tests/science_harness/adapters/*.test.ts \
            2>&1 | tail -c 8000
      - name: node --test shard 3/3 (confounding_gate·proof_envelope·report·trace·cli·anti_theater·agent_loop·comparison·v2_domain·research·retrieval·validation·security·planning·discovery·scripts)
        run: |
          set -o pipefail
          node --test --test-timeout=180000 \
            tests/confounding_gate/*.test.ts tests/proof_envelope/*.test.ts tests/proof_envelope/v2/*.test.ts \
            tests/report/*.test.ts tests/trace/*.test.ts tests/cli/*.test.ts tests/anti_theater/*.test.ts \
            tests/agent_loop/*.test.ts tests/comparison/*.test.ts tests/v2_domain/*.test.ts \
            tests/research/*.test.ts tests/retrieval/*.test.ts tests/validation/*.test.ts \
            tests/security/*.test.ts tests/planning/*.test.ts \
            tests/discovery/*.test.ts tests/discovery/strategies/*.test.ts tests/discovery/safety/*.test.ts tests/discovery/orchestration/*.test.ts tests/embeddings/*.test.ts \
            tests/scripts/*.test.mjs \
            2>&1 | tail -c 8000
      - name: node --test (agent_loop FSM + N3 反幻觉 + assertTerminated)
        run: pnpm run test:agent_loop
      # ============================================================
      # PERF_BUDGET · 性能预算门 v1（b6-S2·08-22 发布列车缺口闭合）
      # 维度：① CLI 冷启动 ② demo 墙钟 ③ 堆上限下 demo 成功（三者在 job 内实测）
      #       ④ 本 job 测试链墙钟（上面 timer 原点 → 此处，复用既有 test 步骤计时）。
      # 方案裁定（弃案已文档化）：弃「独立轻量 job + skip-suite 子集计时」——子集墙钟≠
      #   全量墙钟，预算盖不住真实退化；跑全量则测试套件 CI 重复执行一遍（时长翻倍）。
      #   采纳「复用 test 步骤计时」：测的就是真实全量测试链，零重复跑。
      # 阈值 SSOT=scripts/perf_budget.json（实测 max×倍率·依据与上次实测内嵌）；超阈 →
      #   exit 1 附实测值。基线实测：CI run 31891802369=117s / 31891193390=120s → 阈值 600s
      #   （5× 余量，锚定 30min job timeout 之内——退化在此显式红而非被 timeout 不透明杀死）。
      # ============================================================
      - name: perf_budget gate (test 墙钟 + CLI 冷启动 + demo 墙钟 + 堆上限)
        run: node scripts/perf_budget_check.mjs --test-wall-ms "$(( $(date +%s%3N) - PERF_TEST_WALL_START_MS ))"

  # ============================================================
  # STEP 6 · test_py（unittest，失败 block 之后全部）
  # ============================================================
  test_py:
    needs: test_ts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0   # release_check 需 tags + 完整历史
      - uses: pnpm/action-setup@a8198c4bff370c8506180b035930dea56dbd5288
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: pyproject.toml
      - run: |
          python -m pip install --upgrade pip
          pip install -e .
      - name: Python unittest
        run: pnpm run test:py

  # ============================================================
  # STEP 7 · test_registry（scripts/test_registry.ts 未实现 → 全量 TS 测试兜底）
  # ============================================================
  # ============================================================
  # OPENAPI_CONTRACT · 契约零漂移门禁
  # generate_openapi.mjs --check：zod route schema → schema/openapi.json 字节稳定
  # （契约漂移即 FAIL——防「前端/文档用旧契约」复发）
  # ============================================================
  openapi_contract:
    needs: install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0   # release_check 需 tags + 完整历史
      - uses: pnpm/action-setup@a8198c4bff370c8506180b035930dea56dbd5288
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - name: openapi:check (zod → openapi.json byte-stable)
        run: pnpm run openapi:check
      - name: json_schema:check (TS types → 4 core JSON Schemas byte-stable · ADR-013)
        run: node scripts/generate_json_schema.mts --check
      - name: contract test (6 v2-receipts endpoints envelope + RFC7807)
        run: node --test --test-timeout=180000 tests/api/v2_receipts_contract.test.ts

  # ============================================================
  # TEST_REGISTRY · CLI 命令注册表完整性
  # ============================================================
  test_registry:
    needs: test_py
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0   # release_check 需 tags + 完整历史
      - uses: pnpm/action-setup@a8198c4bff370c8506180b035930dea56dbd5288
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: pyproject.toml
      - run: pnpm install --frozen-lockfile
      - run: |
          python -m pip install --upgrade pip
          pip install -e .
      - name: registry smoke (scripts/test_registry.ts 未实现；跑全量 TS 测试兜底)
        run: pnpm run test

  # ============================================================
  # STEP 8 · repro_check（Makefile 无 repro target → test:py 兜底）
  # ============================================================
  repro_check:
    needs: test_registry
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0   # release_check 需 tags + 完整历史
      - uses: pnpm/action-setup@a8198c4bff370c8506180b035930dea56dbd5288
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: pyproject.toml
      - run: |
          python -m pip install --upgrade pip
          pip install -e .
      - name: repro check (Makefile 无 repro target；跑 test:py 兜底)
        run: pnpm run test:py

  # ============================================================
  # STEP 9 · cross_lang（R2 最高优先闸门：TS canonicalHash === Python canonical_hash byte-equal）
  # 既有测试位于 tests/evidence_log/cross_lang_consistency.test.ts（非 tests/ci/）
  # ============================================================
  cross_lang:
    needs: repro_check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0   # release_check 需 tags + 完整历史
      - uses: pnpm/action-setup@a8198c4bff370c8506180b035930dea56dbd5288
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: pyproject.toml
      - run: pnpm install --frozen-lockfile
      - run: |
          python -m pip install --upgrade pip
          pip install -e .
      - name: cross_lang_consistency (TS canonicalHash === Python canonical_hash, byte-equal)
        run: node --test tests/evidence_log/cross_lang_consistency.test.ts

  # ============================================================
  # STEP 10 · competition_qwen_smoke（条件门：仅可信事件有 DASHSCOPE_API_KEY 时跑，否则 skip 不 block）
  # 双 job 模式：secrets 不能直接用于 job 级 if:（actions/runner#520）。
  # 安全边界：pull_request 不读取 secret、不跑真实 DashScope；workflow_dispatch 仅默认分支读取 secret。
  # 避免 PR head / 手动选择的非默认分支代码拿到凭据。
  # ============================================================
  check_secrets:
    needs: cross_lang
    runs-on: ubuntu-latest
    outputs:
      has_key: ${{ steps.check_trusted.outputs.has_key || steps.check_pr.outputs.has_key }}
    steps:
      - id: check_pr
        if: ${{ github.event_name == 'pull_request' }}
        run: echo "has_key=false" >> "$GITHUB_OUTPUT"
      - id: check_trusted
        if: ${{ github.event_name != 'pull_request' && (github.event_name != 'workflow_dispatch' || github.ref_name == github.event.repository.default_branch) }}
        env:
          DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
        run: |
          if [ -n "$DASHSCOPE_API_KEY" ]; then
            echo "has_key=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_key=false" >> "$GITHUB_OUTPUT"
          fi

  competition_qwen_smoke:
    needs: check_secrets
    if: ${{ github.event_name != 'pull_request' && (github.event_name != 'workflow_dispatch' || github.ref_name == github.event.repository.default_branch) && needs.check_secrets.outputs.has_key == 'true' }}
    runs-on: ubuntu-latest
    env:
      DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
      COMPETITION_BASE_URL: 'https://dashscope.aliyuncs.com/compatible-mode/v1'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0   # release_check 需 tags + 完整历史
      - uses: pnpm/action-setup@a8198c4bff370c8506180b035930dea56dbd5288
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - name: competition_qwen_smoke (4 模型真实调用 + thinking/json_schema 互斥实测)
        run: pnpm exec tsx ci/competition_qwen_smoke.ts

  # ============================================================
  # STEP 12 · verify_chain smoke（evidence_log 启动期链式自验）
  # competition_qwen_smoke 跑了且过 → verify 跑；被 skip → verify 仍跑；失败 → verify 不跑
  # ============================================================
  verify_chain_smoke:
    needs: competition_qwen_smoke
    if: ${{ always() && (needs.competition_qwen_smoke.result == 'success' || needs.competition_qwen_smoke.result == 'skipped') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0   # release_check 需 tags + 完整历史
      - uses: pnpm/action-setup@a8198c4bff370c8506180b035930dea56dbd5288
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - name: verify_chain smoke (启动期 evidence_log 链式自验)
        run: pnpm exec tsx ci/verify_chain_smoke.ts

  # ============================================================
  # STEP 13 · merkle_integrity_smoke（整链 Merkle 根 + 包含证明 + 篡改检测·与 verify_chain_smoke 互补）
  # verify_chain_smoke 证逐条链未断；merkle_integrity_smoke 证整链折叠指纹可信 +
  #   单条包含证明可独立验证 + 双层篡改防御（append-only trigger + Merkle 数学层）。
  # ============================================================
  merkle_integrity_smoke:
    needs: verify_chain_smoke
    if: ${{ always() && (needs.verify_chain_smoke.result == 'success' || needs.verify_chain_smoke.result == 'skipped') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0   # release_check 需 tags + 完整历史
      - uses: pnpm/action-setup@a8198c4bff370c8506180b035930dea56dbd5288
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - name: merkle_integrity smoke (整链 Merkle 根 + inclusion proof + tamper-defense)
        run: pnpm exec tsx ci/merkle_integrity_smoke.ts

  # ============================================================
  # STEP 15 · offline_release_smoke（开源发布形态 smoke·验证 README 顶部命令可跑）
  # 职责：far doctor + far demo tess-offline + far export far-proof + far verify .far-proof
  # 这是「陌生用户复制 README 第一条命令」的 CI 兜底——发布形态命令必须在 CI 可跑。
  # needs: install（独立于串行证据链·不阻塞核心门·但自身须绿）。
  # far doctor 允许 exit 2（仅 WARN·offline 可用）；仅 exit 1（核心损坏）才红。
  # ============================================================
  offline_release_smoke:
    needs: install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0   # release_check 需 tags + 完整历史
      - uses: pnpm/action-setup@a8198c4bff370c8506180b035930dea56dbd5288
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - name: far doctor（环境自诊·零密钥·允许 WARN exit 2）
        shell: bash
        run: |
          set +e
          node src/cli/far.ts doctor
          code=$?
          echo "far doctor exit: $code"
          if [ "$code" = "1" ]; then echo "FAIL: core capability broken"; exit 1; fi
          exit 0
      - name: far version
        run: node src/cli/far.ts version
      - name: far demo tess-offline（offline 裁决演示·零凭据）
        run: node src/cli/far.ts demo tess-offline
      - name: far export far-proof（导出第三方独立重算 bundle）
        run: node src/cli/far.ts export far-proof --demo-chain --force
      - name: far verify .far-proof（第三方独立重算）
        run: node src/cli/far.ts verify .far-proof

  # ============================================================
  # STEP 16 · blocking_gates（设计控制面 + 反剧场 + 覆盖率 + 治理门禁全集）
  # 职责：把 blocking 扫描器（coverage/zero_tolerance/anti_theater 等）接入 CI。
  #       串行链末端依赖，须全绿才可合并。
  # 
  # ============================================================
  # STEP 17 · latex_compile（R10 §12 T1：LaTeX 报告在 doc CI 编译通过）
  # 渲染器产物用真实 TeX 引擎编译验证（pdflatex；booktabs/longtable/hyperref
  # 在 texlive-latex-recommended 内）。非阻断并行 job——编译红=渲染器语法缺陷。
  latex_compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends texlive-latex-recommended
      - name: Render fixture .tex through the real renderer
        run: node scripts/latex_compile_check.mjs
      - name: Compile with pdflatex (nonstop; two passes for refs)
        run: |
          cd .far/latex
          pdflatex -interaction=nonstopmode -halt-on-error report-fixture.tex
          pdflatex -interaction=nonstopmode -halt-on-error report-fixture.tex
          test -s report-fixture.pdf
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: latex-compiled-report
          path: .far/latex/report-fixture.pdf
          if-no-files-found: error

  blocking_gates:
    needs: merkle_integrity_smoke
    if: ${{ always() && (needs.merkle_integrity_smoke.result == 'success' || needs.merkle_integrity_smoke.result == 'skipped') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0   # release_check 需 tags + 完整历史
      - uses: pnpm/action-setup@a8198c4bff370c8506180b035930dea56dbd5288
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
      - run: pnpm install --frozen-lockfile
      - name: Install python deps（coverage_gate 内部跑 Core 测试含跨语言 Python 轴——缺装则 threadpoolctl 等 ModuleNotFoundError → 测试 fail → coverage 连锁红）
        run: |
          python -m pip install --upgrade pip
          pip install -e .
      - name: supply_chain（供应链加固：exact pins + lockfile 一致性）
        run: node scripts/check-supply-chain.mjs
      - name: zero_tolerance_scan（零容忍禁词扫描）
        run: node scripts/zero_tolerance_scan.mjs
      - name: diff_self_check（diff 级自查：逃逸注入/断言削弱/语义漂移——ENG-DIFF-001）
        run: |
          git fetch origin main --depth=1
          git diff origin/main...HEAD > "$RUNNER_TEMP/pr.diff" || echo "" > "$RUNNER_TEMP/pr.diff"
          node scripts/diff_self_check.mjs --diff-file "$RUNNER_TEMP/pr.diff"
      - name: anti_theater_deterministic_scan（反剧场确定性扫描）
        run: node scripts/anti_theater_deterministic_scan.mjs
      - name: no_llm_final_judge_scan（LLM 终审权禁令扫描——CORE-TRUST-001 主防线 CI 强制）
        run: node scripts/no_llm_final_judge_scan.mjs
      - name: mutation_gate smoke（信任内核抽样变异·fec compiler 20 位点·存活率 <10% 门·ENG-TEST-001）
        run: node scripts/mutation_gate.mjs src/fec/compiler.ts tests/fec/fec_mandatory_gate.test.ts --limit 20
      - name: test_risk_map_check（风险类→真实测试/runner 映射·ENG-TEST-001）
        run: pnpm run test:risk-map
      - name: claim_lint（公开声明→收据绑定扫描·CORE-REALITY-001/CORE-CLAIM-001）
        run: node scripts/claim_lint.mjs
      - name: secret_scan（代码库 secret 泄露扫描·CORE-SECRETS-001）
        run: node scripts/secret_scan.mjs --root . --fail-on-hit
      - name: novelty_wording_lint（新颖性声明分级绑定·CORE-NOVELTY-001）
        run: node scripts/novelty_wording_lint.mjs
      - name: doc_command_check（doc↔CLI 一致性·CJ1-G2 文档零漂移）
        run: node scripts/doc_command_check.mjs
      - name: coverage_gate（行≥85%/分支≥75% 红线）
        run: node scripts/coverage_gate.mjs
      - name: repo_hygiene_gate（tracked 内容门禁 A–I · 递归扫描 git index）
        run: node scripts/repo_hygiene_gate.mjs
      - name: fuzz_proof smoke（公开解析面模糊测试·增量档 2k 例；全量 100k 走 pnpm fuzz:proof 本地/夜间）
        run: node scripts/fuzz_proof.mjs --smoke --seed 20260816
      - name: complexity_budget gate（圈复杂度 ≤15/文件 ≤800 行·新违规阻断·存量债务基线化）
        run: node scripts/complexity_budget_check.mjs
      - name: Upload fuzz report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-proof-report
          path: .far/fuzz/fuzz-proof-report.*
          if-no-files-found: warn
