# .github/workflows/depth-evidence.yml
# RED→GREEN 双跑物证 bot（AGENT_ANTISKIM_TRIPWIRES.md T5 机检钩子 · 防 ledger 自我消化 / 伪造 RED→GREEN）
#
# 目的：agent 不能手填 DEPTH_LEDGER §C 的 status=WIRED_GREEN——必须由本 job 在 CI 实跑证明：
#   对每个 status=WIRED_RED 行，checkout base SHA 跑其 proof_test 须 FAIL（非 skip 非 pass），
#   checkout head SHA 跑同测试须 PASS。双跑通过 → 本 job 用 GITHUB_TOKEN 写回 §C 该行
#   status=WIRED_GREEN + 紧随的 `evidence: <base_sha>→<head_sha>` 行。
#
# ⚠️ maintainer 必做（本 job 默认不会生效，需主动启用）：
#   1. GitHub repo → Settings → Actions → General → Workflow permissions → 选 "Read and write permissions"
#      （让 GITHUB_TOKEN 能 push 写回 DEPTH_LEDGER.md）。
#   2. 把 `depth_evidence` 加入 Branch protection → Require status checks（与 depth_gate 并列）。
#   3. CODEOWNERS：PROJECT_PLAN/DEPTH_LEDGER.md 由本 bot + maintainer own（防 agent 手改 status）。
#
# scripts/depth_evidence.mjs 已实现（base/head 双跑 proof_test → UPGRADE 裁决 → 原子写回 evidence；
# 集成测 4/4 + 单元测 17/17 + live --dry-run 物证）。本 job 在 pull_request 事件实跑：
#   - 普通 PR（接线早于 base 合并）→ base PASS + head PASS → INFO → 零写回 exit 0（不阻断）
#   - 接线 PR（base 缺接线 FAIL + head 接线 PASS）→ UPGRADE → 写回 WIRED_GREEN + evidence
#   - ERROR（NO_MATCH/UNKNOWN/NO_FILE_HEAD）→ fail-closed exit 1（零写回）
# workflow_dispatch（无 PR base/head）→ 跳过双跑 exit 0（不阻断），供手动 smoke。
# depth_gate 已独立阻断未接线 PR；本 job 是把 WIRED_RED→GREEN 物证自动化的收紧层。
name: depth-evidence

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # 写回 DEPTH_LEDGER.md evidence 行（须 maintainer 在 repo settings 启用 write 权限）

env:
  NODE_VERSION: '24'
  PNPM_VERSION: '10.29.3'

jobs:
  depth_evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0   # 双跑须 checkout base SHA，需完整历史
      - uses: pnpm/action-setup@v5
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - name: RED→GREEN dual-run evidence (base/head proof_test 双跑 → UPGRADE 写回)
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$GITHUB_EVENT_NAME" != "pull_request" ]; then
            echo "○ depth_evidence: 非 PR 触发（$GITHUB_EVENT_NAME）——无 base/head SHA，跳过双跑（不阻断）。"
            exit 0
          fi
          if [ -z "$BASE_SHA" ] || [ -z "$HEAD_SHA" ]; then
            echo "○ depth_evidence: PR base/head SHA 为空（fork PR 隐藏 sha / 缺权限）——跳过双跑（不阻断）。"
            exit 0
          fi
          node scripts/depth_evidence.mjs --base "$BASE_SHA" --head "$HEAD_SHA"
      - name: Commit back evidence line (若 scripts/depth_evidence.mjs 改了 DEPTH_LEDGER)
        if: success()
        run: |
          if [ -n "$(git status --porcelain PROJECT_PLAN/DEPTH_LEDGER.md)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add PROJECT_PLAN/DEPTH_LEDGER.md
            git commit -m "chore(depth-evidence): write back WIRED_GREEN evidence (base→head dual-run)"
            git push
          else
            echo "○ 无 WIRED_RED→GREEN 升级，不写回。"
          fi
