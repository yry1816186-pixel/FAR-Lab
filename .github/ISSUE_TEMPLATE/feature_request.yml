name: Feature request
description: 提议一个新功能或接线（不是 bug）
title: "[feature]: "
labels: ["enhancement", "triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 解决什么问题？
      description: 当前做不到什么？引用 file:line 或文档。
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 提议的方案
      description: 你想怎么做？涉及哪个子系统（falsifiability / fec / evidence_log / llm_gateway / ...）？
    validations:
      required: true

  - type: dropdown
    id: category
    attributes:
      label: 类别
      options:
        - 核心裁决内核（R0-R9）
        - 证据链 / proof envelope
        - FEC 契约
        - LLM gateway / provider
        - CLI
        - 前端 / 仪表盘
        - 工程治理 / CI
        - 文档
    validations:
      required: true

  - type: checkboxes
    id: real-dep
    attributes:
      label: 诚实边界
      options:
        - label: 此功能若涉及真实 API/数据/GPU，我会标注 NEEDS_API_VALIDATION / NEEDS_REAL_ENV / NEEDS_GPU_VALIDATION
        - label: 我理解 LLM 不作最终裁决者（裁决由 R0-R9 确定性内核给出）

  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案
    validations:
      required: false
