    versionOrCommit: "edb0b3d"
    date: "2026-08-17"
    rationale: 消融基线——无扇出单轮直答（对照组主干）。
    configuration: "src/research/evaluation/baseline.ts variant=direct"
  - name: far-lab-rag-only
    versionOrCommit: "edb0b3d"
    date: "2026-08-17"
    rationale: 消融基线——仅检索无内核裁决。
    configuration: "src/research/evaluation/baseline.ts variant=rag"
  - name: far-lab-no-kernel
    versionOrCommit: "edb0b3d"
    date: "2026-08-17"
    rationale: 消融基线——完整管线但去确定性内核（裁决价值归因）。
