# FCS — Frozen Comparison Set（CORE-CLAIM-001 / EVAL-FCS-001）
# 冻结对标集：任何「领先/世界级/最快」类公开声明的唯一合法参照物。
# 诚实边界（limitations 详列）：v1 比较器全部为内部前版本/消融基线——外部第三方系统对标尚未冻结；
# 在外部比较器入集前，本项目不得发布任何相对外部系统的领先声明。

id: milestone-competition-2026
frozenAt: "2026-08-17T00:00:00Z"
purpose: 竞赛里程碑期间所有公开比较声明的冻结参照集（同条件、可复算、含失败项）
dimensions:
  - verdict-correctness-on-frozen-benchmark
  - reproducibility-third-party-recompute
  - evidence-chain-integrity-tamper-detection
  - honesty-under-no-key-and-rate-limit
  - marginal-cost-per-run
comparators:
