method: 同题/同冻结语料快照/同 gateway 与 profile/同指标族（N>=5 bootstrap CI，MIXED_RUN_MODE 拒聚合）；消融协议见 src/research/evaluation/ablation.ts 与 .far/eval/ablation/（hero/a2/d9 三题 REPORTED 报告）。
hardwareAndEnvironment:
  os: "windows-latest (dev) / ubuntu+macos (CI cross-platform)"
  node: "24.x (engines 锁定)"
  models: "Qwen (DashScope/Bailian) LIVE；无 key 场景 fail-closed 503"
fairnessReview: 内部基线同代码同语料同指标（公平性由 frozen_multirun/ablation 协议机检）；外部系统比较因配置与语料不可等同冻结，尚未纳入——不得据此发布外部领先声明。
limitations:
  - 无外部第三方系统比较器（外部对标未冻结——所有对外比较声明限于内部基线族）
  - 成本数字以 RMB 计价的换算单价为 ASSUMED（券额对账后更新）
  - 三题消融样本（hero/a2/d9）不足以支持跨领域普遍结论（题间异质性已实证）
