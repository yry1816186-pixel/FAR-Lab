<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>FAR-Lab Golden Verify</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f6f7f4;
        --panel: #ffffff;
        --ink: #17202a;
        --muted: #637083;
        --line: #d8ded6;
        --accent: #0f766e;
        --accent-ink: #ffffff;
        --fail: #b42318;
        --pass: #087443;
        --warn: #a15c07;
        --code-bg: #eef1ef;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        background: var(--bg);
        color: var(--ink);
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        letter-spacing: 0;
      }

      main {
        width: min(1120px, calc(100% - 32px));
        margin: 0 auto;
        padding: 24px 0 32px;
      }

      header {
        display: flex;
        align-items: flex-end;
        justify-content: space-between;
        gap: 16px;
        margin-bottom: 18px;
        border-bottom: 1px solid var(--line);
        padding-bottom: 14px;
      }

      h1 {
        margin: 0;
        font-size: 28px;
        line-height: 1.15;
        font-weight: 760;
      }

      .subtle {
        margin: 6px 0 0;
        color: var(--muted);
        font-size: 14px;
      }

      .grid {
        display: grid;
        grid-template-columns: minmax(0, 1.1fr) minmax(320px, 0.9fr);
        gap: 16px;
        align-items: start;
      }

      .panel {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 16px;
      }

      .panel h2 {
        margin: 0 0 12px;
        font-size: 16px;
        line-height: 1.2;
      }

      .row {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        align-items: center;
      }

      input[type="file"] {
        max-width: 100%;
        border: 1px dashed var(--line);
        border-radius: 8px;
        padding: 10px;
        background: #fbfcfb;
      }

      textarea {
        width: 100%;
        min-height: 420px;
        resize: vertical;
        margin-top: 12px;
        padding: 12px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: #fbfcfb;
        color: var(--ink);
        font:
          13px/1.5 ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono",
          monospace;
      }

      button {
        min-height: 40px;
        border: 0;
        border-radius: 8px;
        padding: 0 14px;
        background: var(--accent);
        color: var(--accent-ink);
        font-weight: 680;
        cursor: pointer;
      }

      button.secondary {
        border: 1px solid var(--line);
        background: #ffffff;
        color: var(--ink);
      }

      button:focus-visible,
      textarea:focus-visible,
      input:focus-visible {
        outline: 3px solid rgba(15, 118, 110, 0.22);
        outline-offset: 2px;
      }

      .status {
        display: grid;
        gap: 12px;
      }

      .badge {
        display: inline-flex;
        width: fit-content;
        align-items: center;
        min-height: 30px;
        border-radius: 999px;
        padding: 0 12px;
        font-size: 14px;
        font-weight: 780;
        background: var(--code-bg);
      }

      .badge.pass {
        background: #dcfce7;
        color: var(--pass);
      }

      .badge.fail {
        background: #fee4e2;
        color: var(--fail);
      }

      .badge.warn {
        background: #fef0c7;
        color: var(--warn);
      }

      dl {
        display: grid;
        grid-template-columns: 116px minmax(0, 1fr);
        gap: 8px 10px;
        margin: 0;
        font-size: 13px;
      }

      dt {
        color: var(--muted);
      }

      dd {
        margin: 0;
        min-width: 0;
        overflow-wrap: anywhere;
        font-family:
          ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
      }

      pre {
        margin: 0;
        max-height: 280px;
        overflow: auto;
        border-radius: 8px;
        background: var(--code-bg);
        padding: 12px;
        font:
          12px/1.45 ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono",
          monospace;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
      }

      @media (max-width: 820px) {
        main {
          width: min(100% - 20px, 1120px);
          padding-top: 14px;
        }

        header,
        .grid {
          display: block;
        }

        header > :last-child {
          margin-top: 12px;
        }

        .grid > * + * {
          margin-top: 14px;
        }

        textarea {
          min-height: 320px;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <div>
          <h1>FAR-Lab Golden Verify</h1>
          <p class="subtle">Verdict golden-vector browser recomputation</p>
        </div>
        <div class="row">
          <button id="verifyButton" type="button">Verify</button>
          <button id="clearButton" class="secondary" type="button">Clear</button>
        </div>
      </header>

      <section class="grid">
        <div class="panel">
          <h2>Golden Vector JSON</h2>
          <div class="row">
            <input id="fileInput" type="file" accept=".json,application/json" />
          </div>
          <textarea id="jsonInput" spellcheck="false" autocomplete="off"></textarea>
        </div>

        <aside class="panel status">
          <h2>Result</h2>
          <div id="statusBadge" class="badge warn">WAITING</div>
          <dl>
            <dt>case</dt>
            <dd id="caseValue">-</dd>
            <dt>verdict</dt>
            <dd id="verdictValue">-</dd>
            <dt>rule</dt>
            <dd id="ruleValue">-</dd>
            <dt>backend</dt>
            <dd id="backendValue">browser</dd>
          </dl>
          <pre id="details">{}</pre>
        </aside>
      </section>
    </main>

    <script id="far-verify-golden-standalone">
      (function () {
        "use strict";

        const VERDICT_FLOAT_TOLERANCE = 1e-7;
        const VERDICTS = ["CONFIRMED", "REFUTED", "INCONCLUSIVE", "DEGRADED_SCOPE", "UNTESTED"];
        const STABLE_METRIC_KEY_PATTERN = /^[A-Za-z][A-Za-z0-9_]*(?:\.[A-Za-z0-9_]+)*$/;
        const STAT_PLAN_REQUIRED_FIELDS = [
          "primaryMetric",
          "nullHypothesis",
          "alternativeHypothesis",
          "alpha",
          "effectDirection",
          "confidenceIntervalMethod",
          "multipleTestingCorrection",
          "missingDataPolicy",
          "outlierPolicy",
          "stoppingRule",
        ];

        function verdictLte(left, right) {
          return left <= right + VERDICT_FLOAT_TOLERANCE;
        }

        function verdictGte(left, right) {
          return left >= right - VERDICT_FLOAT_TOLERANCE;
        }

        function decideFiveValueVerdict(input) {
          let integrityFlags = Array.isArray(input.integrityFlags) ? input.integrityFlags.slice() : [];
          const emptyScope = {
            isDegraded: false,
            coverage: "none",
            impactedScopeEdges: [],
            scopeSlipText: null,
            hasSameScopeRefutation: false,
          };
          const emptyStat = {
            refutes: false,
            supports: false,
            conflicting: false,
            underpowered: false,
            effectiveDirection: "unknown",
            primaryAdjustedPValue: null,
            primaryEffectSize: null,
            primaryConfidenceInterval: null,
            hasWarnAssumption: false,
          };
          const fec = input.fec;
          if (fec !== null && fec.contractVersion !== "FEC/2.0") {
            return makeOutput("UNTESTED", ["R0_SCHEMA_INVALID"], "R0_SCHEMA_INVALID", {
              scopeReport: emptyScope,
              statisticalReport: emptyStat,
              evidenceSufficiency: input.evidenceSufficiency,
              integrityFlags,
              untestedReason: "SCHEMA_INVALID",
            });
          }

          const compileResult = fec === null ? null : compileFecForVerdict(fec);
          if (compileResult === null || !compileResult.ok) {
            return makeOutput("UNTESTED", ["R1_FEC_NOT_COMPILABLE"], "R1_FEC_NOT_COMPILABLE", {
              scopeReport: emptyScope,
              statisticalReport: emptyStat,
              evidenceSufficiency: input.evidenceSufficiency,
              integrityFlags,
              untestedReason: "FEC_NOT_READY",
            });
          }
          integrityFlags = mergeIntegrityFlags(integrityFlags, compileResult.integrityFlags);

          if (!hasValidDatasetBinding(input)) {
            return makeOutput("UNTESTED", ["R2_NO_VALID_DATASET_BINDING"], "R2_NO_VALID_DATASET_BINDING", {
              scopeReport: emptyScope,
              statisticalReport: emptyStat,
              evidenceSufficiency: input.evidenceSufficiency,
              integrityFlags,
              untestedReason: "EVIDENCE_MISSING",
            });
          }

          const criticalDeviations = input.protocolDeviations.filter(function (deviation) {
            return deviation.severity === "critical";
          });
          if (criticalDeviations.length > 0) {
            for (const deviation of criticalDeviations) {
              if (deviation.kind === "alpha_rewrite" && !integrityFlags.includes("harking_risk")) {
                integrityFlags.push("harking_risk");
              }
              if (deviation.kind === "metric_swap" && !integrityFlags.includes("p_hacking_risk")) {
                integrityFlags.push("p_hacking_risk");
              }
            }
            return makeOutput(
              "UNTESTED",
              ["R3_CRITICAL_PROTOCOL_DEVIATION"].concat(
                criticalDeviations.map(function (deviation) {
                  return deviationReasonCode(String(deviation.kind || ""));
                }),
              ),
              "R3_CRITICAL_PROTOCOL_DEVIATION",
              {
                scopeReport: evaluateScope(input),
                statisticalReport: evaluateStatistics(input),
                evidenceSufficiency: input.evidenceSufficiency,
                integrityFlags,
                untestedReason: "CRITICAL_DEVIATION",
              },
            );
          }

          const scopeReport = evaluateScope(input);
          const statisticalReport = evaluateStatistics(input);
          const alpha = fec.statisticalPlan.alpha;
          const powerPlan = fec.powerPlan;
          const minimumDetectableEffect = powerPlan === undefined ? undefined : powerPlan.minimumDetectableEffect;

          if (scopeReport.isDegraded && !scopeReport.hasSameScopeRefutation) {
            return makeOutput(
              "DEGRADED_SCOPE",
              ["R4_SCOPE_MISMATCH_NONCRITICAL"].concat(scopeDriftCodes(input)),
              "R4_SCOPE_MISMATCH_NONCRITICAL",
              {
                scopeReport,
                statisticalReport,
                evidenceSufficiency: input.evidenceSufficiency,
                integrityFlags,
              },
            );
          }

          if (
            input.antiTheaterFindings.some(function (finding) {
              return finding.severity === "fail";
            })
          ) {
            return makeOutput("UNTESTED", ["ANTI_THEATER_FAIL"], "ANTI_THEATER_FAIL", {
              scopeReport,
              statisticalReport,
              evidenceSufficiency: input.evidenceSufficiency,
              integrityFlags,
              untestedReason: "ANTI_THEATER_FAIL",
            });
          }

          if (statisticalReport.conflicting) {
            return makeOutput(
              "INCONCLUSIVE",
              ["R5_CONTRADICTORY_SIGNIFICANT_EVIDENCE"],
              "R5_CONTRADICTORY_SIGNIFICANT_EVIDENCE",
              {
                scopeReport,
                statisticalReport,
                evidenceSufficiency: input.evidenceSufficiency,
                integrityFlags,
              },
            );
          }

          // R-identifier-fabrication (FUSION-OS-14·与 verdict_kernel_v2.ts:335 对齐·R5 后 R6 前)。
          var identifierClaims = input.identifierClaims;
          if (identifierClaims !== undefined && identifierClaims.length > 0) {
            if (
              identifierClaims.some(function (claim) {
                return claim.resolutionStatus === "unresolved";
              })
            ) {
              return makeOutput(
                "UNTESTED",
                ["R_IDENTIFIER_RESOLUTION_ENV_FAILURE"],
                "R_IDENTIFIER_RESOLUTION_ENV_FAILURE",
                {
                  scopeReport,
                  statisticalReport,
                  evidenceSufficiency: input.evidenceSufficiency,
                  integrityFlags,
                  untestedReason: "R_IDENTIFIER_RESOLUTION_ENV_FAILURE",
                },
              );
            }
            if (
              identifierClaims.some(function (claim) {
                return claim.resolutionStatus === "not_found";
              })
            ) {
              return makeOutput("REFUTED", ["UNVERIFIED_IDENTIFIER"], "R_IDENTIFIER_FABRICATION", {
                scopeReport,
                statisticalReport,
                evidenceSufficiency: input.evidenceSufficiency,
                integrityFlags,
              });
            }
          }

          if (statisticalReport.refutes) {
            return makeOutput("REFUTED", ["R6_PRIMARY_TEST_REFUTES"], "R6_PRIMARY_TEST_REFUTES", {
              scopeReport,
              statisticalReport,
              evidenceSufficiency: input.evidenceSufficiency,
              integrityFlags,
            });
          }

          // R-derivation-form (FUSION-OS-13·与 verdict_kernel_v2.ts:370 对齐·R6 后 R7/R-causal 前)。
          if (statisticalReport.formMismatch) {
            return makeOutput("INCONCLUSIVE", ["R_DERIVATION_FORM_MISMATCH"], "R_DERIVATION_FORM_MISMATCH", {
              scopeReport,
              statisticalReport,
              evidenceSufficiency: input.evidenceSufficiency,
              integrityFlags,
            });
          }

          const r7Pass =
            statisticalReport.supports &&
            statisticalReport.primaryAdjustedPValue !== null &&
            verdictLte(statisticalReport.primaryAdjustedPValue, alpha) &&
            statisticalReport.primaryEffectSize !== null &&
            (minimumDetectableEffect === undefined ||
              verdictGte(statisticalReport.primaryEffectSize, minimumDetectableEffect)) &&
            input.evidenceSufficiency.status === "sufficient" &&
            !scopeReport.hasSameScopeRefutation &&
            integrityFlags.length === 0 &&
            !statisticalReport.hasWarnAssumption;

          if (input.claimType === "causal" && input.confoundingGateResult !== undefined) {
            const causalEffect = confoundingOutcomeVerdictEffect(
              input.confoundingGateResult.outcome,
              input.evidenceBasis,
              r7Pass,
            );
            if (causalEffect.verdictEffect === "degrade_to_degraded_scope") {
              return makeOutput("DEGRADED_SCOPE", causalEffect.reasonCodes, "R_CAUSAL_CONFOUNDING_FAIL", {
                scopeReport,
                statisticalReport,
                evidenceSufficiency: input.evidenceSufficiency,
                integrityFlags,
              });
            }
            if (causalEffect.verdictEffect === "downgrade_to_inconclusive") {
              return makeOutput("INCONCLUSIVE", causalEffect.reasonCodes, "R_CAUSAL_CONFOUNDING_WARN", {
                scopeReport,
                statisticalReport,
                evidenceSufficiency: input.evidenceSufficiency,
                integrityFlags,
              });
            }
          }

          if (r7Pass) {
            return makeOutput("CONFIRMED", ["R7_PRIMARY_TEST_CONFIRMS"], "R7_PRIMARY_TEST_CONFIRMS", {
              scopeReport,
              statisticalReport,
              evidenceSufficiency: input.evidenceSufficiency,
              integrityFlags,
              boundedSupport: true,
            });
          }

          const primaryAdjusted = statisticalReport.primaryAdjustedPValue;
          const primaryEffect = statisticalReport.primaryEffectSize;
          const r8Trigger =
            (primaryAdjusted !== null && !verdictLte(primaryAdjusted, alpha)) ||
            input.evidenceSufficiency.powerStatus === "underpowered" ||
            (primaryEffect !== null &&
              minimumDetectableEffect !== undefined &&
              !verdictGte(primaryEffect, minimumDetectableEffect)) ||
            statisticalReport.hasWarnAssumption ||
            integrityFlags.includes("p_hacking_risk");
          if (r8Trigger) {
            const reasonCodes = ["R8_INSUFFICIENT_POWER_OR_NULL"];
            if (
              input.antiTheaterFindings.some(function (finding) {
                return finding.kind === "seed-cherry-picking";
              })
            ) {
              reasonCodes.push("SEED_CHERRY_PICK_WARN");
            }
            return makeOutput("INCONCLUSIVE", reasonCodes, "R8_INSUFFICIENT_POWER_OR_NULL", {
              scopeReport,
              statisticalReport,
              evidenceSufficiency: input.evidenceSufficiency,
              integrityFlags,
            });
          }

          if (
            input.statistics.length > 0 &&
            input.statistics.every(function (stat) {
              return stat.status === "skipped";
            })
          ) {
            return makeOutput("UNTESTED", ["R9_ALL_TESTS_SKIPPED"], "R9_ALL_TESTS_SKIPPED", {
              scopeReport,
              statisticalReport,
              evidenceSufficiency: input.evidenceSufficiency,
              integrityFlags,
              untestedReason: "NO_DECISION_PATH",
            });
          }

          return makeOutput("UNTESTED", ["NO_DECISION_PATH"], "NO_DECISION_PATH", {
            scopeReport,
            statisticalReport,
            evidenceSufficiency: input.evidenceSufficiency,
            integrityFlags,
            untestedReason: "NO_DECISION_PATH",
          });
        }

        function evaluateScope(input) {
          if (input.fec === null) {
            return {
              isDegraded: false,
              coverage: "none",
              impactedScopeEdges: [],
              scopeSlipText: null,
              hasSameScopeRefutation: false,
            };
          }
          const evidenceScope = input.datasetBindings.map(function (binding) {
            return binding.scopeCoverage;
          });
          const scopePartial = evidenceScope.some(function (scope) {
            return scope.relation !== "within";
          });
          const driftWarn = input.statistics.some(function (stat) {
            return stat.assumptionDiagnostics.some(function (diagnostic) {
              return diagnostic.kind === "distribution_drift" && diagnostic.severity === "warn";
            });
          });
          const isDegraded = scopePartial || driftWarn;
          const impacted = evidenceScope.filter(function (scope) {
            return scope.relation !== "within";
          });
          const hasSameScopeRefutation = input.contradictionSet.some(function (item) {
            return item.crossesRefutationThreshold && item.sameScope;
          });
          return {
            isDegraded,
            coverage: evidenceScope.length === 0 ? "none" : isDegraded ? "partial" : "full",
            impactedScopeEdges: impacted,
            scopeSlipText: isDegraded ? renderScopeSlip(impacted, driftWarn) : null,
            hasSameScopeRefutation,
          };
        }

        function evaluateStatistics(input) {
          if (input.fec === null) {
            return {
              refutes: false,
              supports: false,
              conflicting: false,
              underpowered: false,
              effectiveDirection: "unknown",
              primaryAdjustedPValue: null,
              primaryEffectSize: null,
              primaryConfidenceInterval: null,
              hasWarnAssumption: false,
            };
          }
          const alpha = input.fec.statisticalPlan.alpha;
          const metricKey = input.fec.metric.metricKey;
          const all = input.statistics;
          const primary = all.filter(function (stat) {
            return stat.testId === metricKey;
          });
          const significant = all.filter(function (stat) {
            return stat.adjustedPValue !== undefined && verdictLte(stat.adjustedPValue, alpha);
          });
          const supports = significant.some(function (stat) {
            return stat.effectDirection === "supports";
          });
          const refutes = significant.some(function (stat) {
            return stat.effectDirection === "refutes";
          });
          const primaryFirst = primary[0];
          const hasWarnAssumption =
            all.some(function (stat) {
              return stat.assumptionDiagnostics.some(function (diagnostic) {
                return diagnostic.severity === "warn";
              });
            }) ||
            input.antiTheaterFindings.some(function (finding) {
              return finding.severity === "warn";
            });
          // FUSION-OS-13: derivationForm 不匹配（值相等也不信·与 verdict_kernel_v2.ts evaluateStatistics 对齐）。
          const expectedForm = input.fec.statisticalPlan.expectedDerivationForm;
          const formMismatch =
            expectedForm !== undefined &&
            all.some(function (stat) {
              return stat.derivationForm !== undefined && stat.derivationForm !== expectedForm;
            });

          return {
            refutes,
            supports,
            conflicting: supports && refutes,
            underpowered: input.evidenceSufficiency.powerStatus === "underpowered",
            effectiveDirection: supports ? "supports" : refutes ? "refutes" : "unknown",
            primaryAdjustedPValue: primaryFirst && primaryFirst.adjustedPValue !== undefined ? primaryFirst.adjustedPValue : null,
            primaryEffectSize:
              primaryFirst && primaryFirst.effectSizeObserved !== undefined ? primaryFirst.effectSizeObserved : null,
            primaryConfidenceInterval:
              primaryFirst && primaryFirst.confidenceInterval !== undefined ? primaryFirst.confidenceInterval : null,
            hasWarnAssumption,
            formMismatch,
          };
        }

        function makeOutput(verdict, reasonCodes, decisiveRuleId, ctx) {
          return {
            verdict,
            reasonCodes,
            ruleTrace: [{ ruleId: decisiveRuleId, triggered: true }],
            decisiveRuleId,
            scopeReport: ctx.scopeReport,
            statisticalReport: ctx.statisticalReport,
            evidenceSufficiency: ctx.evidenceSufficiency,
            untestedReason: ctx.untestedReason || null,
            integrityFlags: ctx.integrityFlags,
            boundedSupport: ctx.boundedSupport === true,
          };
        }

        function compileFecForVerdict(fec) {
          const errors = [];
          const integrityFlags = Array.isArray(fec.integrityFlags) ? fec.integrityFlags.slice() : [];

          if (typeof fec.measurableImplication !== "string" || fec.measurableImplication.trim().length === 0) {
            errors.push("FEC_NOT_COMPILABLE");
          }

          const scope = fec.scope || {};
          if (
            String(scope.population || "").trim().length === 0 ||
            String(scope.timeWindow || "").trim().length === 0 ||
            String(scope.domainConstraint || "").trim().length === 0
          ) {
            errors.push("SCOPE_UNBOUNDED");
          }

          const metric = fec.metric || {};
          const metricKey = typeof metric.metricKey === "string" ? metric.metricKey : "";
          if (metricKey.trim().length === 0 || !STABLE_METRIC_KEY_PATTERN.test(metricKey)) {
            errors.push("METRIC_MISSING");
          }

          const threshold = fec.threshold || {};
          if (!isFiniteNumber(threshold.value) || threshold.unit !== metric.unit) {
            errors.push("THRESHOLD_MISSING");
          }

          if (!Array.isArray(fec.datasetRequirements) || !Array.isArray(fec.workflowRequirements)) {
            errors.push("EVIDENCE_REQUIREMENT_MISSING");
          } else if (fec.datasetRequirements.length === 0 || fec.workflowRequirements.length === 0) {
            errors.push("EVIDENCE_REQUIREMENT_MISSING");
          }

          const statPlan = fec.statisticalPlan || {};
          const missingStatFields = STAT_PLAN_REQUIRED_FIELDS.filter(function (field) {
            return isMissingStatField(statPlan[field]);
          });
          if (missingStatFields.length > 0) {
            errors.push("STAT_PLAN_MISSING");
          } else if (!isFiniteNumber(statPlan.alpha) || !(statPlan.alpha > 0 && statPlan.alpha < 1)) {
            errors.push("STAT_PLAN_MISSING");
          }

          const familySize = fec.multipleTestingPlan ? fec.multipleTestingPlan.familySize || 1 : 1;
          if (familySize > 1 && statPlan.multipleTestingCorrection === "none") {
            if (!integrityFlags.includes("p_hacking_risk")) {
              integrityFlags.push("p_hacking_risk");
            }
          }

          if (involvesRandomness(fec) && (!fec.seedPolicy || fec.seedPolicy.fixed !== true)) {
            errors.push("PROTOCOL_INCOMPLETE");
          }

          if (!fec.freeze || fec.freeze.frozenBy !== "deterministic_freezer") {
            errors.push("LLM_FROZEN");
          }

          return { ok: errors.length === 0, integrityFlags, errors };
        }

        function isMissingStatField(value) {
          return value === null || value === undefined || (typeof value === "string" && value.trim().length === 0);
        }

        function isFiniteNumber(value) {
          return typeof value === "number" && Number.isFinite(value);
        }

        function involvesRandomness(fec) {
          const workflows = Array.isArray(fec.workflowRequirements) ? fec.workflowRequirements : [];
          const workflowRequiresSeed = workflows.some(function (workflow) {
            return workflow.requireFixedSeed === true;
          });
          const metricDeterministic = fec.metric && fec.metric.isDeterministic === true;
          return workflowRequiresSeed || !metricDeterministic;
        }

        function mergeIntegrityFlags(inputFlags, compiledFlags) {
          const merged = inputFlags.slice();
          for (const flag of compiledFlags) {
            if (!merged.includes(flag)) {
              merged.push(flag);
            }
          }
          return merged;
        }

        function hasValidDatasetBinding(input) {
          return input.datasetBindings.some(function (binding) {
            return binding.sourceAnchor && binding.sourceAnchor.resolved === true;
          });
        }

        function scopeDriftCodes(input) {
          const hasDrift = input.statistics.some(function (stat) {
            return stat.assumptionDiagnostics.some(function (diagnostic) {
              return diagnostic.kind === "distribution_drift";
            });
          });
          return hasDrift ? ["DATASET_DRIFT_WARN"] : [];
        }

        function deviationReasonCode(kind) {
          switch (kind) {
            case "alpha_rewrite":
              return "ALPHA_REWRITE_DETECTED";
            case "metric_swap":
              return "METRIC_SWAP_DETECTED";
            default:
              return kind.toUpperCase() + "_DETECTED";
          }
        }

        function renderScopeSlip(impacted, driftWarn) {
          const parts = impacted
            .map(function (scope) {
              return String(scope.dimension) + "=" + String(scope.value) + "(" + String(scope.relation) + ")";
            })
            .filter(function (part) {
              return part.length > 0;
            });
          if (driftWarn) {
            parts.push("dataset distribution drift");
          }
          return parts.length > 0 ? "scope narrowed: " + parts.join("; ") : "scope narrowed";
        }

        function confoundingOutcomeVerdictEffect(outcome, evidenceBasis, baseWouldConfirm) {
          if (outcome === "PASS") {
            return { verdictEffect: "none", reasonCodes: [] };
          }
          if (outcome === "WARN") {
            return baseWouldConfirm
              ? { verdictEffect: "downgrade_to_inconclusive", reasonCodes: ["R_CAUSAL_CONFOUNDING_WARN"] }
              : { verdictEffect: "none", reasonCodes: [] };
          }
          if (outcome === "FAIL") {
            return {
              verdictEffect: "degrade_to_degraded_scope",
              reasonCodes:
                evidenceBasis === "observational_only"
                  ? ["R_CAUSAL_CONFOUNDING_FAIL", "F6_CAUSAL_HONESTY"]
                  : ["R_CAUSAL_CONFOUNDING_FAIL"],
            };
          }
          throw new Error("unhandled ConfoundingOutcome " + String(outcome));
        }

        function verifyGoldenCase(rawCase) {
          const errors = [];
          if (!rawCase || typeof rawCase !== "object" || Array.isArray(rawCase)) {
            return caseFailure(null, ["case root must be an object"]);
          }
          const expected = rawCase.expected;
          const input = rawCase.input;
          if (!input || typeof input !== "object" || !expected || typeof expected !== "object") {
            return caseFailure(rawCase.caseId || null, ["case input and expected must be objects"]);
          }
          const output = decideFiveValueVerdict(input.kernel);
          if (!VERDICTS.includes(output.verdict)) {
            errors.push("computed verdict is invalid: " + String(output.verdict));
          }
          if (output.verdict !== expected.verdict) {
            errors.push("verdict mismatch: expected " + expected.verdict + ", got " + output.verdict);
          }
          if (output.decisiveRuleId !== expected.decisiveRuleId) {
            errors.push(
              "decisiveRuleId mismatch: expected " + expected.decisiveRuleId + ", got " + output.decisiveRuleId,
            );
          }
          if (!sameStringArray(output.reasonCodes, expected.reasonCodes)) {
            errors.push(
              "reasonCodes mismatch: expected " +
                JSON.stringify(expected.reasonCodes) +
                ", got " +
                JSON.stringify(output.reasonCodes),
            );
          }
          if (output.untestedReason !== expected.untestedReason) {
            errors.push(
              "untestedReason mismatch: expected " +
                String(expected.untestedReason) +
                ", got " +
                String(output.untestedReason),
            );
          }
          return {
            status: errors.length === 0 ? "PASS" : "FAIL",
            backend: "browser",
            caseId: rawCase.caseId || null,
            verdict: output.verdict,
            decisiveRuleId: output.decisiveRuleId,
            reasonCodes: output.reasonCodes,
            expectedVerdict: expected.verdict,
            errors,
          };
        }

        function caseFailure(caseId, errors) {
          return {
            status: "FAIL",
            backend: "browser",
            caseId,
            verdict: null,
            decisiveRuleId: null,
            reasonCodes: [],
            expectedVerdict: null,
            errors,
          };
        }

        function sameStringArray(left, right) {
          return (
            Array.isArray(left) &&
            Array.isArray(right) &&
            left.length === right.length &&
            left.every(function (value, index) {
              return value === right[index];
            })
          );
        }

        function byId(id) {
          const element = document.getElementById(id);
          if (!element) {
            throw new Error("missing element #" + id);
          }
          return element;
        }

        function setText(id, value) {
          byId(id).textContent = value;
        }

        function renderResult(result) {
          const badge = byId("statusBadge");
          badge.textContent = result.status;
          badge.className = "badge " + (result.status === "PASS" ? "pass" : "fail");
          setText("caseValue", result.caseId || "-");
          setText("verdictValue", result.verdict || "-");
          setText("ruleValue", result.decisiveRuleId || "-");
          setText("backendValue", result.backend || "browser");
          setText("details", JSON.stringify(result, null, 2));
        }

        function renderError(error) {
          renderResult(caseFailure(null, [error instanceof Error ? error.message : String(error)]));
        }

        function verifyFromText(text) {
          return verifyGoldenCase(JSON.parse(text));
        }

        function wireUi() {
          const input = byId("jsonInput");
          const fileInput = byId("fileInput");
          byId("verifyButton").addEventListener("click", function () {
            try {
              renderResult(verifyFromText(input.value));
            } catch (error) {
              renderError(error);
            }
          });
          byId("clearButton").addEventListener("click", function () {
            input.value = "";
            setText("details", "{}");
            setText("caseValue", "-");
            setText("verdictValue", "-");
            setText("ruleValue", "-");
            setText("backendValue", "browser");
            const badge = byId("statusBadge");
            badge.textContent = "WAITING";
            badge.className = "badge warn";
          });
          fileInput.addEventListener("change", async function () {
            const file = fileInput.files && fileInput.files[0];
            if (file) {
              input.value = await file.text();
            }
          });
        }

        globalThis.FARGoldenVerify = {
          decideFiveValueVerdict,
          evaluateScope,
          evaluateStatistics,
          verifyGoldenCase,
        };

        if (typeof document !== "undefined") {
          document.addEventListener("DOMContentLoaded", wireUi);
        }
      })();
    </script>
  </body>
</html>
