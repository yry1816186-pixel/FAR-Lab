<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="FAR-Lab — falsifiable, auditable research missions with deterministic verdicts and tamper-detectable evidence chains." />
    <meta name="theme-color" content="#fafaf8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>FAR-Lab</title>
    <script>
      // Pre-paint theme resolution (avoids a light/dark flash on load).
      // Key 'far-theme': 'dark' | 'light' | absent (follow prefers-color-scheme).
      (function () {
        try {
          var stored = window.localStorage.getItem('far-theme');
          var dark =
            stored === 'dark' ||
            (stored === null &&
              window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (dark) {
            document.documentElement.classList.add('dark');
            var meta = document.querySelector('meta[name="theme-color"]');
            if (meta) meta.setAttribute('content', '#101113');
          }
        } catch (e) {
          /* storage unavailable: fall back to the light default */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
