[package]
name = "far-lab-desktop"
version = "0.1.0"
description = "FAR-Lab desktop shell — Tauri v2 webview over the local FAR-Lab API server"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-global-shortcut = "2.3.2"
tauri-plugin-notification = "2.3.1"
tauri-plugin-single-instance = "2.4.3"
tauri-plugin-window-state = "2.4.1"
serde_json = "1"
windows-sys = { version = "0.60", features = ["Win32_System_Registry"] }

[target.'cfg(windows)'.dependencies]
# Job Object (KILL_ON_JOB_CLOSE): the spawned node server must die with the shell
# even when the shell is force-killed (TerminateProcess skips Drop/exit handlers).
windows-sys = { version = "0.60", features = [
  "Win32_System_JobObjects",
  "Win32_System_Threading",
  "Win32_Foundation",
  "Win32_Security",
] }

[target.'cfg(target_os = "linux")'.dependencies]
# PR_SET_PDEATHSIG via pre_exec: Linux counterpart of the Job-Object guarantee
# (parent death => SIGKILL to the spawned server). Confirmed needed by the WSL2
# force-kill e2e test (D-068): without it, kill -9 on the shell orphans node.
libc = "0.2"

# Deliberately minimal: the shell only spawns the Node server, waits for its
# health endpoint and opens a webview. No second business logic lives here.
